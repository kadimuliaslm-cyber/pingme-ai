    <!-- =====================================================
         CHAT AREA
    ====================================================== -->

    <main
      class="chat-area"
      id="chatArea">


      <!-- WELCOME SCREEN -->

      <section
        class="welcome-screen"
        id="welcomeScreen">


        <div class="welcome-icon">
          ✦
        </div>


        <h2>
          How can I help you?
        </h2>


        <p>
          Ask me anything. You can chat in বাংলা or English.
        </p>



        <!-- SUGGESTIONS -->

        <div class="suggestions">


          <button
            class="suggestion"
            type="button">

            ✨ Write something for me

          </button>


          <button
            class="suggestion"
            type="button">

            💡 Give me an idea

          </button>


          <button
            class="suggestion"
            type="button">

            🌐 Translate something

          </button>


        </div>


      </section>


    </main>



    <!-- =====================================================
         FUTURE ATTACHMENT PREVIEW AREA
         
         ছবি / ভিডিও / ফাইল / অডিও পাঠানোর আগে
         এখানে preview দেখানো যাবে।
    ====================================================== -->

    <div
      class="attachment-preview"
      id="attachmentPreview"
      aria-hidden="true">

    </div>



    <!-- =====================================================
         MESSAGE COMPOSER
    ====================================================== -->

    <div class="composer-wrapper">


      <div class="composer">


        <!-- =================================================
             PLUS BUTTON
        ================================================== -->

        <button
          class="icon-btn plus-btn"
          id="plusBtn"
          type="button"
          aria-label="Add attachment"
          aria-expanded="false"
          aria-controls="attachmentMenu">


          <svg
            viewBox="0 0 24 24"
            width="22"
            height="22"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round">

            <line
              x1="12"
              y1="5"
              x2="12"
              y2="19">
            </line>

            <line
              x1="5"
              y1="12"
              x2="19"
              y2="12">
            </line>

          </svg>


        </button>



        <!-- =================================================
             ATTACHMENT MENU
             
             + চাপলে এই ৪টি অপশন খুলবে।
        ================================================== -->

        <div
          class="attachment-menu"
          id="attachmentMenu"
          aria-hidden="true">


          <!-- PHOTO -->

          <button
            class="attachment-option"
            id="photoOption"
            type="button">

            <span class="attachment-icon">

              <svg
                viewBox="0 0 24 24"
                width="23"
                height="23"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">

                <rect
                  x="3"
                  y="3"
                  width="18"
                  height="18"
                  rx="3">
                </rect>

                <circle
                  cx="8.5"
                  cy="8.5"
                  r="1.5">
                </circle>

                <path
                  d="M21 15l-5-5L5 21">
                </path>

              </svg>

            </span>

            <span>
              Photo
            </span>

          </button>



          <!-- VIDEO -->

          <button
            class="attachment-option"
            id="videoOption"
            type="button">

            <span class="attachment-icon">

              <svg
                viewBox="0 0 24 24"

                height="23"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"

                <rect

                  y="5"

              Video

          </button>



          <!-- FILE -->

          <button
            class="attachment-option"

            <span class="attachment-icon">

              <svg
                viewBox="0 0 24 24"
                width="23"
                height="23"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">

                <path

                <polyline
                  points="14 2 14 8 20 8">
                </polyline>

                <line

                  y1="13"

                  y2="13">
                </line>

                <line

        <!-- =================================================

        ================================================== -->

        <input

        <input
          type="file"
          id="videoInput"

          hidden>


        <input
          type="file"

          hidden>


        <input
          type="file"
          id="audioInput"

        <!-- =================================================

        ================================================== -->

        <textarea

        <!-- =================================================

      <div class="composer-note">

      </div>


    </div>



    <!-- =====================================================
         FUTURE CHAT / AI FEATURES PLACEHOLDER

         পরে এখানে:
         - AI response
         - typing animation
         - voice response
         - image response
         - file response
         - memory
         - chat history
         ইত্যাদি কাজ করবে।
    ====================================================== -->

    <div
      id="futureFeatures"
      hidden>

    </div>


  </div>



  <!-- =====================================================
       FIREBASE AI LOGIC
       
       আগের Firebase configuration রাখা হয়েছে।
    ====================================================== -->

  <script type="module">


    import {
      initializeApp
    }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


    import {
      getAI,
      getGenerativeModel,
      GoogleAIBackend
    }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-ai.js";



    const firebaseConfig = {


      apiKey:
        "AIzaSyB4dAUhxEao415YdVg4l4WYJ21hQ9V-tyk",


      authDomain:
        "pingme-ai-8d8cc.firebaseapp.com",


      projectId:
        "pingme-ai-8d8cc",


      storageBucket:
        "pingme-ai-8d8cc.firebasestorage.app",


      messagingSenderId:
        "547217020747",


      appId:
        "1:547217020747:web:62b7d3843672703d8abace",


      measurementId:
        "G-3WRC64CRDR"


    };



    const firebaseApp =
      initializeApp(firebaseConfig);



    const ai =
      getAI(
        firebaseApp,
        {
          backend:
            new GoogleAIBackend()
        }
      );



    const model =
      getGenerativeModel(
        ai,
        {
          model:
            "gemini-3.8-flash"
        }
      );



    /*
      PingMe AI Model

      পরে chat system এই model ব্যবহার করবে।
    */

    window.pingMeAIModel =
      model;


  </script>

  <script

  </script>


</body>
