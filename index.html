<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PingMe AI</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
}

body{
  background:#f8f9fa;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

.app-container{
  width:100%;
  max-width:450px;
  height:100vh;
  background:#fff;
  position:relative;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* TOP BAR */

.top-bar{
  height:66px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 20px;
  background:#fff;
  z-index:20;
  border-bottom:1px solid #f1f1f1;
}

.menu-btn{
  background:none;
  border:none;
  cursor:pointer;
  padding:4px 0;
  display:flex;
  flex-direction:column;
  gap:5px;
}

.menu-btn span{
  display:block;
  height:2px;
  background:#0d0d0d;
  border-radius:1px;
}

.menu-btn span:first-child{
  width:18px;
}

.menu-btn span:last-child{
  width:12px;
}

.center-m-logo{
  width:34px;
  height:34px;
  border-radius:50%;
  background:#edf3ff;
  color:#1a73e8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:600;
  font-size:16px;
}

.profile-avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  background:#004d40;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:500;
}

/* CHAT */

.chat-content{
  flex:1;
  padding:20px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:16px;
  background:#fff;
  padding-bottom:150px;
}

.message{
  max-width:75%;
  padding:12px 16px;
  font-size:16px;
  line-height:1.4;
}

.user-message{
  align-self:flex-end;
  background:#f1f3f4;
  color:#0d0d0d;
  border-radius:18px 18px 4px 18px;
}

.ai-message{
  align-self:flex-start;
  background:#fff;
  color:#0d0d0d;
  border-radius:18px 18px 18px 4px;
  border:1px solid #e0e0e0;
}

/* TYPING */

.typing-indicator{
  align-self:flex-start;
  background:#fff;
  border:1px solid #e0e0e0;
  padding:14px 20px;
  border-radius:18px 18px 18px 4px;
  display:none;
  align-items:center;
  gap:6px;
}

.typing-indicator.active{
  display:flex;
}

.dot{
  width:6px;
  height:6px;
  background:#0d0d0d;
  border-radius:50%;
  animation:bounce 1.4s infinite ease-in-out both;
}

.dot:nth-child(1){
  animation-delay:-.32s;
}

.dot:nth-child(2){
  animation-delay:-.16s;
}

@keyframes bounce{
  0%,80%,100%{
    transform:scale(0);
    opacity:.3;
  }
  40%{
    transform:scale(1);
    opacity:1;
  }
}

/* BOTTOM */

.bottom-fixed-area{
  position:absolute;
  bottom:16px;
  left:16px;
  right:16px;
  background:transparent;
  display:flex;
  flex-direction:column;
  gap:10px;
  z-index:15;
}

.main-input-box{
  display:flex;
  align-items:center;
  background:#fff;
  border-radius:24px;
  padding:12px 18px;
  border:1px solid #e0e0e0;
  width:100%;
}

.chat-input{
  flex:1;
  border:none;
  background:transparent;
  font-size:16px;
  color:#0d0d0d;
  outline:none;
}

.chat-input::placeholder{
  color:#9aa0a6;
}

.inner-actions{
  display:flex;
  align-items:center;
  gap:14px;
}

.icon-btn{
  background:none;
  border:none;
  cursor:pointer;
  color:#0d0d0d;
  display:flex;
  align-items:center;
  justify-content:center;
}

.control-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  width:100%;
  padding:0 4px;
}

.plus-action-btn{
  background:#f1f3f4;
  border:none;
  width:44px;
  height:44px;
  border-radius:50%;
  font-size:22px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#0d0d0d;
  font-weight:300;
}

.send-arrow-btn{
  width:44px;
  height:44px;
  background:#e8f0fe;
  color:#1a73e8;
  border:none;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.2s;
}

.send-arrow-btn.ready-to-send{
  background:#1a73e8;
  color:#fff;
}

/* =========================
   SETTINGS SIDE PANEL
========================= */

.settings-overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.25);
  display:none;
  z-index:50;
}

.settings-overlay.active{
  display:block;
}

.settings-panel{
  position:absolute;
  top:0;
  right:0;
  width:86%;
  max-width:380px;
  height:100%;
  background:#fff;
  z-index:60;
  transform:translateX(100%);
  transition:transform .25s ease;
  box-shadow:-8px 0 25px rgba(0,0,0,.12);
  overflow-y:auto;
}

.settings-panel.active{
  transform:translateX(0);
}

.settings-header{
  height:66px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  border-bottom:1px solid #eee;
}

.settings-title{
  font-size:20px;
  font-weight:600;
}

.close-settings{
  width:36px;
  height:36px;
  border:none;
  border-radius:50%;
  background:#f1f3f4;
  font-size:22px;
  cursor:pointer;
}

.settings-body{
  padding:20px;
}

.settings-section{
  margin-bottom:26px;
}

.settings-section-title{
  font-size:13px;
  color:#777;
  margin-bottom:10px;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.settings-item{
  width:100%;
  min-height:56px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 0;
  border-bottom:1px solid #f1f1f1;
}

.settings-item-left{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.settings-item-name{
  font-size:16px;
  color:#111;
}

.settings-item-description{
  font-size:12px;
  color:#888;
}

.settings-arrow{
  color:#999;
  font-size:20px;
}

/* MODEL SAMPLE */

.model-box{
  background:#f7f8fa;
  border-radius:14px;
  padding:14px;
  margin-top:10px;
}

.model-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:11px 4px;
  font-size:14px;
}

.model-status{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#22a06b;
}

/* ========================= */

@media(max-width:450px){

  .settings-panel{
    width:88%;
  }

}
</style>
</head>

<body>

<div class="app-container">

  <!-- TOP BAR -->
  <div class="top-bar">

    <button class="menu-btn" id="menuBtn">
      <span></span>
      <span></span>
    </button>

    <div class="center-m-logo">M</div>

    <div class="profile-avatar" id="userInitial">
      U
    </div>

  </div>


  <!-- CHAT -->
  <div class="chat-content" id="chatContent">

    <div class="typing-indicator" id="typingIndicator">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

  </div>


  <!-- INPUT -->
  <div class="bottom-fixed-area">

    <div class="main-input-box">

      <input
        type="text"
        class="chat-input"
        id="chatInput"
        placeholder="Ask anything"
      >

      <div class="inner-actions">

        <!-- MIC - UNCHANGED -->
        <button class="icon-btn">

          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
            <path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
            <line x1="12" y1="19" x2="12" y2="22"></line>
          </svg>

        </button>


        <!-- CAMERA - UNCHANGED -->
        <button class="icon-btn">

          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>

        </button>

      </div>

    </div>


    <div class="control-row">

      <button class="plus-action-btn">
        +
      </button>

      <button class="send-arrow-btn" id="sendBtn">

        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>

      </button>

    </div>

  </div>


  <!-- SETTINGS OVERLAY -->
  <div class="settings-overlay" id="settingsOverlay"></div>


  <!-- SETTINGS PANEL -->
  <div class="settings-panel" id="settingsPanel">

    <div class="settings-header">

      <div class="settings-title">
        Settings
      </div>

      <button
        class="close-settings"
        id="closeSettings"
      >
        ×
      </button>

    </div>


    <div class="settings-body">

      <!-- ACCOUNT -->
      <div class="settings-section">

        <div class="settings-section-title">
          Account
        </div>

        <div class="settings-item">

          <div class="settings-item-left">

            <div class="settings-item-name">
              Profile
            </div>

            <div class="settings-item-description">
              Manage your profile
            </div>

          </div>

          <div class="settings-arrow">
            ›
          </div>

        </div>


        <div class="settings-item">

          <div class="settings-item-left">

            <div class="settings-item-name">
              Appearance
            </div>

            <div class="settings-item-description">
              Light theme
            </div>

          </div>

          <div class="settings-arrow">
            ›
          </div>

        </div>

      </div>


      <!-- AI -->
      <div class="settings-section">

        <div class="settings-section-title">
          AI Assistant
        </div>

        <div class="settings-item">

          <div class="settings-item-left">

            <div class="settings-item-name">
              Assistant
            </div>

            <div class="settings-item-description">
              PingMe
            </div>

          </div>

          <div class="settings-arrow">
            ›
          </div>

        </div>


        <!-- INTERNAL MODELS -->
        <div class="model-box">

          <div class="model-row">
            <span>GPT Engine</span>
            <span class="model-status"></span>
          </div>

          <div class="model-row">
            <span>Gemini Engine</span>
            <span class="model-status"></span>
          </div>

          <div class="model-row">
            <span>Claude Engine</span>
            <span class="model-status"></span>
          </div>

        </div>

      </div>


      <!-- APP -->
      <div class="settings-section">

        <div class="settings-section-title">
          App
        </div>

        <div class="settings-item">

          <div class="settings-item-left">

            <div class="settings-item-name">
              Notifications
            </div>

            <div class="settings-item-description">
              Manage notifications
            </div>

          </div>

          <div class="settings-arrow">
            ›
          </div>

        </div>


        <div class="settings-item">

          <div class="settings-item-left">

            <div class="settings-item-name">
              About PingMe AI
            </div>

            <div class="settings-item-description">
              PingMe AI assistant
            </div>

          </div>

          <div class="settings-arrow">
            ›
          </div>

        </div>

      </div>

    </div>

  </div>

</div>


<script>

/* =========================
   IDENTITY
========================= */

const PINGME_IDENTITY = {
  aiName: "PingMe",
  companyName: "PingMe AI"
};


/* =========================
   USER
========================= */

const ACTIVE_USER_DETAILS = {
  name: "User"
};

document.getElementById("userInitial").innerText =
  ACTIVE_USER_DETAILS.name.charAt(0).toUpperCase();


/* =========================
   THREE INTERNAL MODELS
========================= */

const CORE_AI_MODELS = {
  m1: "GPT Engine",
  m2: "Gemini Engine",
  m3: "Claude Engine"
};

let currentActiveModel = CORE_AI_MODELS.m1;


/* =========================
   API PLACEHOLDER
========================= */

const PRIVATE_API_PASSPHRASE =
  "PASTE_YOUR_API_KEY_HERE";


/* =========================
   CHAT
========================= */

const chatInput =
  document.getElementById("chatInput");

const sendBtn =
  document.getElementById("sendBtn");

const chatContent =
  document.getElementById("chatContent");

const typingIndicator =
  document.getElementById("typingIndicator");


chatInput.addEventListener("input", () => {

  if(chatInput.value.trim() !== ""){

    sendBtn.classList.add(
      "ready-to-send"
    );

  }else{

    sendBtn.classList.remove(
      "ready-to-send"
    );

  }

});


function adjustViewportScroll(){

  chatContent.scrollTop =
    chatContent.scrollHeight;

}


function getPingMeIdentityResponse(promptText){

  const text =
    promptText.toLowerCase().trim();


  if(
    text.includes("তোমার নাম") ||
    text.includes("আপনার নাম") ||
    text.includes("তুই কে") ||
    text.includes("তুমি কে") ||
    text.includes("who are you") ||
    text.includes("your name") ||
    text.includes("what is your name")
  ){

    return "আমার নাম PingMe।";

  }


  if(
    text.includes("কোন কোম্পানি") ||
    text.includes("কোম্পানির নাম") ||
    text.includes("তোমাদের কোম্পানি") ||
    text.includes("your company") ||
    text.includes("which company") ||
    text.includes("company name")
  ){

    return "আমি PingMe AI-এর AI assistant।";

  }


  return null;
}


function dispatchChatPrompt(){

  const promptText =
    chatInput.value.trim();

  if(promptText === "") return;


  const userBubble =
    document.createElement("div");

  userBubble.className =
    "message user-message";

  userBubble.innerText =
    promptText;

  chatContent.insertBefore(
    userBubble,
    typingIndicator
  );


  chatInput.value = "";

  sendBtn.classList.remove(
    "ready-to-send"
  );


  adjustViewportScroll();


  typingIndicator.classList.add(
    "active"
  );

  adjustViewportScroll();


  setTimeout(() => {

    typingIndicator.classList.remove(
      "active"
    );


    const aiBubble =
      document.createElement("div");

    aiBubble.className =
      "message ai-message";


    const identityResponse =
      getPingMeIdentityResponse(
        promptText
      );


    if(identityResponse){

      aiBubble.innerText =
        identityResponse;

    }else{

      aiBubble.innerText =
        "আমি PingMe। আপনার মেসেজটি প্রসেস করার জন্য প্রস্তুত।";

    }


    chatContent.insertBefore(
      aiBubble,
      typingIndicator
    );


    adjustViewportScroll();

  }, 1000);

}


sendBtn.addEventListener(
  "click",
  dispatchChatPrompt
);


chatInput.addEventListener(
  "keypress",
  (e) => {

    if(e.key === "Enter"){

      dispatchChatPrompt();

    }

  }
);


/* =========================
   SETTINGS OPEN/CLOSE
========================= */

const menuBtn =
  document.getElementById("menuBtn");

const settingsPanel =
  document.getElementById("settingsPanel");

const settingsOverlay =
  document.getElementById("settingsOverlay");

const closeSettings =
  document.getElementById("closeSettings");


function openSettings(){

  settingsPanel.classList.add(
    "active"
  );

  settingsOverlay.classList.add(
    "active"
  );

}


function closeSettingsPanel(){

  settingsPanel.classList.remove(
    "active"
  );

  settingsOverlay.classList.remove(
    "active"
  );

}


/* MENU চাপলে SETTINGS খুলবে */

menuBtn.addEventListener(
  "click",
  openSettings
);


/* X চাপলে বন্ধ */

closeSettings.addEventListener(
  "click",
  closeSettingsPanel
);


/* বাইরে চাপলে বন্ধ */

settingsOverlay.addEventListener(
  "click",
  closeSettingsPanel
);

</script>

</body>
</html>
