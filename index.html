<script>
    // =====================================================
    // GEMINI API KEY
    // =====================================================

    const SECURITY_API_KEY =
        "AIzaSyB4dAUhxEao415YdVg4l4WYJ21hQ9V-tyk";


    // =====================================================
    // PINGME IDENTITY
    // =====================================================

    const AI_IDENTITY = {
        nickname: "pingme",
        companyName: "pingme-ai"
    };


    // =====================================================
    // DOM ELEMENTS
    // =====================================================

    const chatInputField =
        document.getElementById("chatInputField");

    const mainWidgetCard =
        document.getElementById("mainWidgetCard");

    const arrowSubmitBtn =
        document.getElementById("arrowSubmitBtn");

    const chatViewport =
        document.getElementById("chatViewport");

    const typingIndicatorBox =
        document.getElementById("typingIndicatorBox");


    // =====================================================
    // INPUT POPUP
    // =====================================================

    chatInputField.addEventListener("focus", () => {
        mainWidgetCard.classList.add("popup-expanded-card");
    });


    chatInputField.addEventListener("input", () => {

        if (chatInputField.value.trim() !== "") {
            arrowSubmitBtn.classList.add(
                "typing-active-blue"
            );
        } else {
            arrowSubmitBtn.classList.remove(
                "typing-active-blue"
            );
        }

    });


    // =====================================================
    // OUTSIDE CLICK
    // =====================================================

    document.addEventListener("click", (e) => {

        if (
            !mainWidgetCard.contains(e.target) &&
            chatInputField.value.trim() === ""
        ) {
            mainWidgetCard.classList.remove(
                "popup-expanded-card"
            );
        }

    });


    // =====================================================
    // GEMINI API REQUEST
    // =====================================================

    async function askGemini(userText) {

        const model =
            "gemini-2.5-flash";

        const url =
            "https://generativelanguage.googleapis.com/v1beta/models/" +
            model +
            ":generateContent?key=" +
            encodeURIComponent(SECURITY_API_KEY);


        const requestBody = {

            contents: [
                {
                    role: "user",
                    parts: [
                        {
                            text:
                                "তুমি PingMe AI। তোমার নাম pingme। " +
                                "কোম্পানির নাম pingme-ai। " +
                                "স্বাভাবিক, সংক্ষিপ্ত ও সাহায্যকারীভাবে উত্তর দাও।\n\n" +
                                userText
                        }
                    ]
                }
            ]

        };


        const response = await fetch(
            url,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(requestBody)
            }
        );


        if (!response.ok) {

            const errorText =
                await response.text();

            throw new Error(
                "Gemini API Error: " +
                response.status +
                " " +
                errorText
            );

        }


        const data =
            await response.json();


        const answer =
            data?.candidates?.[0]?.content?.parts?.[0]?.text;


        if (!answer) {
            throw new Error(
                "Gemini কোনো উত্তর দেয়নি।"
            );
        }


        return answer;

    }


    // =====================================================
    // SEND MESSAGE
    // =====================================================

    async function handleMessageSend() {

        const userText =
            chatInputField.value.trim();


        if (userText === "") {
            return;
        }


        // USER MESSAGE

        const userBubble =
            document.createElement("div");

        userBubble.className =
            "message-bubble user-side-bubble";

        userBubble.innerText =
            userText;

        chatViewport.appendChild(
            userBubble
        );


        // RESET INPUT

        chatInputField.value = "";

        arrowSubmitBtn.classList.remove(
            "typing-active-blue"
        );

        mainWidgetCard.classList.remove(
            "popup-expanded-card"
        );

        chatInputField.blur();


        chatViewport.scrollTop =
            chatViewport.scrollHeight;


        // SHOW TYPING

        typingIndicatorBox.classList.add(
            "active"
        );


        try {

            // GEMINI-তে আসল মেসেজ পাঠানো

            const aiResponse =
                await askGemini(userText);


            // AI BUBBLE

            const aiBubble =
                document.createElement("div");

            aiBubble.className =
                "message-bubble ai-side-bubble";

            aiBubble.innerText =
                aiResponse;


            chatViewport.appendChild(
                aiBubble
            );


        } catch (error) {

            console.error(error);


            const errorBubble =
                document.createElement("div");

            errorBubble.className =
                "message-bubble ai-side-bubble";

            errorBubble.innerText =
                "দুঃখিত, এই মুহূর্তে Gemini-এর সাথে সংযোগ করা যাচ্ছে না।";


            chatViewport.appendChild(
                errorBubble
            );

        }


        // HIDE TYPING

        typingIndicatorBox.classList.remove(
            "active"
        );


        chatViewport.scrollTop =
            chatViewport.scrollHeight;

    }


    // =====================================================
    // SEND BUTTON
    // =====================================================

    arrowSubmitBtn.addEventListener(
        "click",
        handleMessageSend
    );


    // =====================================================
    // ENTER KEY
    // =====================================================

    chatInputField.addEventListener(
        "keypress",
        (e) => {

            if (e.key === "Enter") {

                e.preventDefault();

                handleMessageSend();

            }

        }
    );

</script>
