<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>PingMe AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,
  "Segoe UI",Roboto,Arial,sans-serif;
  background:#fff;
  color:#111;
}

button,textarea{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:#fff;
}

/* ================= HEADER ================= */

.top-bar{
  height:60px;
  min-height:60px;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  border-bottom:1px solid #eee;
  background:rgba(255,255,255,.97);
  position:relative;
  z-index:20;
}

.icon-btn{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:#222;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.15s ease;
}

.icon-btn:hover{
  background:#f3f3f3;
}

.icon-btn:active{
  transform:scale(.94);
}

.brand{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  pointer-events:none;
}

.brand h1{
  font-size:18px;
  line-height:1;
  font-weight:700;
  letter-spacing:-.25px;
}

/* ================= CHAT ================= */

.chat-area{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  padding:24px 14px 145px;
  scroll-behavior:smooth;
}

.chat-area::-webkit-scrollbar{
  width:6px;
}

.chat-area::-webkit-scrollbar-thumb{
  background:#d8d8d8;
  border-radius:20px;
}

/* ================= WELCOME ================= */

.welcome-screen{
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:40px 8px 80px;
  text-align:center;
}

.welcome-screen h2{
  font-size:clamp(27px,7vw,38px);
  line-height:1.15;
  font-weight:650;
  letter-spacing:-.8px;
  margin-bottom:26px;
}

.suggestions-list{
  width:min(100%,650px);
  display:flex;
  flex-direction:column;
  gap:10px;
}

.suggestion-item{
  width:100%;
  min-height:54px;
  padding:12px 15px;
  border:1px solid #e6e6e6;
  border-radius:16px;
  background:#fff;
  color:#222;
  display:flex;
  align-items:center;
  gap:13px;
  text-align:left;
  cursor:pointer;
  transition:.15s ease;
}

.suggestion-item:hover{
  background:#f7f7f7;
  border-color:#d8d8d8;
}

.suggestion-item:active{
  transform:scale(.99);
}

.suggestion-item .icon{
  width:30px;
  min-width:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

.suggestion-item .text{
  font-size:14px;
  font-weight:500;
}

/* ================= MESSAGES ================= */

.message-row{
  width:min(100%,850px);
  margin:0 auto 20px;
  display:flex;
}

.message-row.user{
  justify-content:flex-end;
}

.message-row.ai{
  justify-content:flex-start;
}

.message-box{
  max-width:min(88%,720px);
}

.message-row.user .message-box{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
}

.message{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  line-height:1.55;
  font-size:15.5px;
}

.message-row.user .message{
  background:#111;
  color:#fff;
  padding:11px 15px;
  border-radius:19px 19px 5px 19px;
}

.message-row.ai .message{
  color:#151515;
  padding:4px 0;
}

/* ================= ACTIONS ================= */

.message-actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:8px;
}

.message-action-btn{
  border:1px solid #e4e4e4;
  background:#fff;
  color:#555;
  border-radius:9px;
  padding:5px 9px;
  font-size:11px;
  cursor:pointer;
}

.message-action-btn:hover{
  background:#f5f5f5;
}

/* ================= THINKING ================= */

.thinking-message{
  display:flex;
  align-items:center;
  min-height:28px;
}

.thinking-spinner{
  width:18px;
  height:18px;
  border:2px solid #ddd;
  border-top-color:#111;
  border-radius:50%;
  animation:spin .75s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

/* ================= COMPOSER ================= */

.composer-wrapper{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:30;
  padding:10px 12px 12px;
  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,0),
      rgba(255,255,255,.94) 22%,
      #fff 48%
    );
}

.composer{
  width:min(100%,850px);
  min-height:54px;
  margin:0 auto;
  padding:6px 7px;
  display:flex;
  align-items:flex-end;
  gap:3px;
  border:1px solid #dcdcdc;
  border-radius:28px;
  background:#fff;
  box-shadow:0 4px 22px rgba(0,0,0,.07);
}

.composer .icon-btn{
  flex:0 0 40px;
}

#messageInput{
  flex:1;
  width:100%;
  min-width:0;
  min-height:40px;
  max-height:120px;
  resize:none;
  border:0;
  outline:none;
  background:transparent;
  color:#111;
  padding:10px 5px;
  line-height:20px;
  font-size:15.5px;
  overflow-y:auto;
}

#messageInput::placeholder{
  color:#8b8b8b;
}

.send-btn{
  width:40px;
  height:40px;
  flex:0 0 40px;
  border:0;
  border-radius:50%;
  background:#111;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.15s ease;
}

.send-btn:hover{
  background:#292929;
}

.send-btn:active{
  transform:scale(.94);
}

.send-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

/* ================= ATTACHMENTS ================= */

.attachment-menu{
  width:min(250px,calc(100vw - 28px));
  position:absolute;
  left:max(12px,calc(50% - 425px));
  bottom:118px;
  padding:8px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  border:1px solid #e4e4e4;
  border-radius:16px;
  background:#fff;
  box-shadow:0 12px 35px rgba(0,0,0,.12);
}

.attachment-menu[hidden]{
  display:none;
}

.attachment-menu button{
  min-height:42px;
  border:0;
  border-radius:10px;
  background:#fff;
  color:#222;
  text-align:left;
  padding:9px 10px;
  cursor:pointer;
  font-size:13px;
}

.attachment-menu button:hover{
  background:#f4f4f4;
}

/* ================= NOTE ================= */

.composer-note{
  width:min(100%,850px);
  margin:7px auto 0;
  text-align:center;
  color:#888;
  font-size:10.5px;
  line-height:1.35;
}

/* ================= PANELS ================= */

.side-panel{
  position:fixed;
  top:0;
  bottom:0;
  width:min(320px,88vw);
  background:#fff;
  z-index:100;
  box-shadow:0 0 30px rgba(0,0,0,.12);
  transition:transform .22s ease;
}

.side-panel.left{
  left:0;
  transform:translateX(-105%);
}

.side-panel.right{
  right:0;
  transform:translateX(105%);
}

.side-panel.open{
  transform:translateX(0);
}

.panel-head{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px 0 18px;
  border-bottom:1px solid #eee;
}

.panel-head strong{
  font-size:16px;
}

.panel-body{
  padding:16px;
}

.panel-empty{
  color:#888;
  text-align:center;
  padding:35px 10px;
  font-size:14px;
}

.panel-setting{
  padding:13px 0;
  border-bottom:1px solid #eee;
}

.panel-setting strong{
  display:block;
  font-size:14px;
  margin-bottom:4px;
}

.panel-setting span{
  color:#777;
  font-size:12px;
}

.history-item{
  width:100%;
  border:1px solid #e7e7e7;
  background:#fff;
  border-radius:12px;
  padding:11px;
  text-align:left;
  margin-bottom:8px;
  cursor:pointer;
}

.history-item:hover{
  background:#f7f7f7;
}

.history-title{
  font-size:13px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.history-time{
  margin-top:4px;
  color:#888;
  font-size:10px;
}

/* ================= OVERLAY ================= */

.panel-overlay{
  position:fixed;
  inset:0;
  z-index:90;
  background:rgba(0,0,0,.22);
}

.panel-overlay[hidden]{
  display:none;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  .top-bar{
    height:56px;
    min-height:56px;
  }

  .chat-area{
    padding:18px 10px 145px;
  }

  .welcome-screen{
    padding-top:30px;
  }

  .suggestion-item{
    min-height:52px;
  }

  .message-box{
    max-width:91%;
  }

  .composer-wrapper{
    padding-left:8px;
    padding-right:8px;
  }

  .composer-note{
    font-size:9.5px;
  }
}

button:focus-visible,
textarea:focus-visible{
  outline:2px solid #777;
  outline-offset:2px;
}
</style>
</head>

/* =========================================================
   MEMORY
   ========================================================= */

const conversationMemory = [];

const MAX_MEMORY = 30;


function saveMemory(role, text) {

  if (
    !text ||
    !String(text).trim()
  ) {
    return;
  }

  conversationMemory.push({

    role:
      role,

    text:
      String(text).trim()

  });

  while (
    conversationMemory.length >
    MAX_MEMORY
  ) {

    conversationMemory.shift();

  }

}


function getMemoryText() {

  if (
    !conversationMemory.length
  ) {

    return "No previous conversation.";

  }

  return conversationMemory
    .map(item => {

      const speaker =
        item.role === "user"
          ? "User"
          : "PingMe";

      return (
        speaker +
        ": " +
        item.text
      );

    })
    .join("\n");

}


/* =========================================================
   MODEL LIST
   ========================================================= */

function getModels() {

  return [
    model1,
    model2,
    model3
  ].filter(Boolean);

}


/* =========================================================
   AI RESPONSE
   ========================================================= */

async function generatePingMeResponse(
  userText
) {

  if (initializationError) {

    throw initializationError;

  }

  const models =
    getModels();

  if (!models.length) {

    throw new Error(
      "PINGME_MODELS_NOT_READY"
    );

  }

  const memory =
    getMemoryText();

  const prompt = `

${PINGME_SYSTEM_INSTRUCTION}

========================================
CONVERSATION SO FAR
========================================

${memory}

========================================
LATEST USER MESSAGE
========================================

${userText}

========================================
INSTRUCTIONS
========================================

Answer the latest user message.

Use previous conversation when relevant.

Answer every relevant question in the message.

Stay on topic.

Remember:

Nickname = PingMe
Company = PingMe AI

Never identify yourself as Gemini.

Now answer naturally.

`;

  let lastError =
    null;

  for (
    const model of models
  ) {

    try {

      const result =
        await model.generateContent(
          prompt
        );

      const answer =
        result?.response?.text?.();

      if (
        answer &&
        answer.trim()
      ) {

        return answer.trim();

      }

    } catch (error) {

      console.error(
        "PingMe model error:",
        error
      );

      lastError =
        error;

    }

  }

  throw (
    lastError ||
    new Error(
      "ALL_MODELS_FAILED"
    )
  );

}


/* =========================================================
   MESSAGE UI
   ========================================================= */

function addMessage(
  text,
  sender
) {

  if (welcomeScreen) {

    welcomeScreen.style.display =
      "none";

  }

  const row =
    document.createElement(
      "div"
    );

  row.className =
    sender === "user"
      ? "message-row user"
      : "message-row ai";

  const box =
    document.createElement(
      "div"
    );

  box.className =
    "message-box";

  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message";

  message.textContent =
    text;

  box.appendChild(
    message
  );


  if (
    sender === "ai"
  ) {

    const actions =
      document.createElement(
        "div"
      );

    actions.className =
      "message-actions";


    const copyBtn =
      document.createElement(
        "button"
      );

    copyBtn.type =
      "button";

    copyBtn.className =
      "message-action-btn";

    copyBtn.textContent =
      "Copy";

    copyBtn.addEventListener(
      "click",
      async () => {

        try {

          await navigator.clipboard.writeText(
            text
          );

          copyBtn.textContent =
            "Copied";

          setTimeout(
            () => {
              copyBtn.textContent =
                "Copy";
            },
            1500
          );

        } catch {

          copyBtn.textContent =
            "Copy failed";

        }

      }
    );


    const linkBtn =
      document.createElement(
        "button"
      );

    linkBtn.type =
      "button";

    linkBtn.className =
      "message-action-btn";

    linkBtn.textContent =
      "Copy Link";

    linkBtn.addEventListener(
      "click",
      async () => {

        const match =
          text.match(
            /https?:\/\/[^\s]+/i
          );

        if (!match) {

          linkBtn.textContent =
            "No link";

          setTimeout(
            () => {
              linkBtn.textContent =
                "Copy Link";
            },
            1500
          );

          return;

        }

        try {

          await navigator.clipboard.writeText(
            match[0]
          );

          linkBtn.textContent =
            "Link Copied";

          setTimeout(
            () => {
              linkBtn.textContent =
                "Copy Link";
            },
            1500
          );

        } catch {

          linkBtn.textContent =
            "Copy failed";

        }

      }
    );


    actions.appendChild(
      copyBtn
    );

    actions.appendChild(
      linkBtn
    );

    box.appendChild(
      actions
    );

  }


  row.appendChild(
    box
  );

  chatArea.appendChild(
    row
  );

  chatArea.scrollTop =
    chatArea.scrollHeight;

  return row;

}

/* =========================================================
   SEND BUTTON STATE
   ========================================================= */

function updateSendButton() {

  const hasText =
    messageInput.value.trim().length > 0;

  if (hasText) {

    voiceIcon.style.display =
      "none";

    sendIcon.style.display =
      "block";

    sendBtn.setAttribute(
      "aria-label",
      "Send"
    );

  } else {

    voiceIcon.style.display =
      "block";

    sendIcon.style.display =
      "none";

    sendBtn.setAttribute(
      "aria-label",
      "Voice"
    );

  }

}


/* =========================================================
   SEND MESSAGE
   ========================================================= */

async function sendMessage() {

  const text =
    messageInput.value.trim();

  if (!text) {
    return;
  }

  sendBtn.disabled =
    true;

  addMessage(
    text,
    "user"
  );

  saveMemory(
    "user",
    text
  );

  messageInput.value =
    "";

  messageInput.style.height =
    "auto";

  updateSendButton();

  const thinking =
    addThinkingMessage();

  try {

    const answer =
      await generatePingMeResponse(
        text
      );

    if (thinking) {
      thinking.remove();
    }

    addMessage(
      answer,
      "ai"
    );

    saveMemory(
      "model",
      answer
    );

    saveHistory();

  } catch (error) {

    console.error(
      "PingMe AI error:",
      error
    );

    if (thinking) {
      thinking.remove();
    }

    const errorText =
      String(
        error?.message ||
        error ||
        ""
      );

    if (
      errorText ===
      "PINGME_API_KEY_NOT_SET"
    ) {

      addMessage(
        "API key বসানো হয়নি। HTML-এর PINGME_API_KEY জায়গায় নতুন Firebase API key বসা।",
        "ai"
      );

    } else if (
      errorText.includes("429") ||
      errorText.toLowerCase().includes("quota")
    ) {

      addMessage(
        "PingMe এখন একটু ব্যস্ত আছে। একটু পর আবার চেষ্টা কর।",
        "ai"
      );

    } else if (
      errorText.includes(
        "PINGME_MODELS_NOT_READY"
      )
    ) {

      addMessage(
        "PingMe AI চালু হয়নি। Firebase configuration এবং API key চেক কর।",
        "ai"
      );

    } else {

      addMessage(
        "এই মুহূর্তে PingMe AI-এর সাথে কানেক্ট হতে পারলাম না। একটু পর আবার চেষ্টা কর।",
        "ai"
      );

    }

  } finally {

    sendBtn.disabled =
      false;

    messageInput.focus();

  }

}

/* =========================================================
   VOICE INPUT
   ========================================================= */

let recognition =
  null;


function startVoiceInput() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    addMessage(
      "এই ব্রাউজারে voice input support নেই।",
      "ai"
    );

    return;

  }

  if (recognition) {

    try {
      recognition.stop();
    } catch {}

  }

  recognition =
    new SpeechRecognition();

  recognition.lang =
    "bn-BD";

  recognition.interimResults =
    false;

  recognition.continuous =
    false;

  micBtn.style.background =
    "#eeeeee";

  recognition.onresult =
    event => {

      const transcript =
        event.results[0][0].transcript;

      messageInput.value +=
        transcript;

      messageInput.dispatchEvent(
        new Event("input")
      );

      messageInput.focus();

    };

  recognition.onerror =
    error => {

      console.error(
        "Voice input error:",
        error
      );

    };

  recognition.onend =
    () => {

      micBtn.style.background =
        "transparent";

    };

  try {

    recognition.start();

  } catch (error) {

    console.error(
      "Voice start error:",
      error
    );

    micBtn.style.background =
      "transparent";

  }

}


micBtn.addEventListener(
  "click",
  startVoiceInput
);


/* =========================================================
   HISTORY
   ========================================================= */

function saveHistory() {

  if (
    conversationMemory.length < 2
  ) {
    return;
  }

  const firstUserMessage =
    conversationMemory.find(
      item =>
        item.role === "user"
    );

  if (!firstUserMessage) {
    return;
  }

  let history =
    [];

  try {

    history =
      JSON.parse(
        localStorage.getItem(
          "pingme_history"
        ) || "[]"
      );

  } catch {

    history =
      [];

  }

  const conversation = {

    title:
      firstUserMessage.text.slice(
        0,
        55
      ),

    time:
      new Date().toLocaleString(),

    messages:
      conversationMemory.slice()

  };

  history =
    history.filter(
      item =>
        item.title !==
        conversation.title
    );

  history.unshift(
    conversation
  );

  history =
    history.slice(
      0,
      20
    );

  try {

    localStorage.setItem(
      "pingme_history",
      JSON.stringify(history)
    );

  } catch {

    console.warn(
      "History storage unavailable."
    );

  }

}


/* =========================================================
   RENDER HISTORY
   ========================================================= */

function renderHistory() {

  historyBody.innerHTML =
    "";

  let history =
    [];

  try {

    history =
      JSON.parse(
        localStorage.getItem(
          "pingme_history"
        ) || "[]"
      );

  } catch {

    history =
      [];

  }

  if (!history.length) {

    const empty =
      document.createElement(
        "div"
      );

    empty.className =
      "panel-empty";

    empty.textContent =
      "Your conversations will appear here.";

    historyBody.appendChild(
      empty
    );

    return;

  }

  history.forEach(
    item => {

      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "history-item";

      const title =
        document.createElement(
          "div"
        );

      title.className =
        "history-title";

      title.textContent =
        item.title;

      const time =
        document.createElement(
          "div"
        );

      time.className =
        "history-time";

      time.textContent =
        item.time;

      button.appendChild(
        title
      );

      button.appendChild(
        time
      );

      button.addEventListener(
        "click",
        () => {

          if (
            Array.isArray(
              item.messages
            )
          ) {

            chatArea.innerHTML =
              "";

            conversationMemory.length =
              0;

            item.messages.forEach(
              message => {

                conversationMemory.push(
                  message
                );

                addMessage(
                  message.text,
                  message.role === "user"
                    ? "user"
                    : "ai"
                );

              }
            );

          }

          closePanels();

        }
      );

      historyBody.appendChild(
        button
      );

    }
  );

}
