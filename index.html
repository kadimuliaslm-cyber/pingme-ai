<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no"
    >

    <title>PingMe AI Chat System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .chat-space-viewport {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
        }

        .welcome-screen {
            width: 100%;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 10px 30px;
        }

        .welcome-title {
            font-size: 28px;
            font-weight: 600;
            color: #111111;
            text-align: center;
            margin-bottom: 8px;
        }

        .welcome-subtitle {
            font-size: 14px;
            color: #777777;
            text-align: center;
            line-height: 1.5;
            max-width: 330px;
            margin-bottom: 24px;
        }

        .feature-list {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .feature-item {
            width: 100%;
            height: 44px;
            padding: 0 13px;
            border: 1px solid #e5e5ea;
            border-radius: 12px;
            background: #ffffff;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .feature-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            margin-right: 10px;
        }

        .feature-text {
            flex: 1;
            font-size: 14px;
            color: #202124;
        }

        .feature-arrow {
            font-size: 20px;
            color: #8a8a8a;
            line-height: 1;
        }

        .input-panel-wrapper {
            width: 100%;
            background: #ffffff;
            padding: 12px 16px 16px;
            flex-shrink: 0;
            border-top: 1px solid #f1f3f4;
        }

        .bottom-master-widget {
            width: 100%;
            background: #ffffff;
            border: 1px solid #e5e5ea;
            border-radius: 30px;
            padding: 12px 18px;
            display: flex;
            flex-direction: column;
            gap: 0;
            box-shadow: 0 2px 12px rgba(0,0,0,0.03);
            transition: all 0.22s ease;
        }

        .text-field-container {
            width: 100%;
            display: flex;
            align-items: center;
        }

        .chat-main-input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 16px;
            color: #0d0d0d;
            outline: none;
            padding: 4px 0;
        }

        .chat-main-input::placeholder {
            color: #757575;
        }

        .model-selector {
            width: 100%;
            margin-bottom: 10px;
            display: none;
        }

        .model-selector.visible {
            display: block;
        }

        .model-select {
            width: 100%;
            border: 1px solid #e5e5ea;
            background: #ffffff;
            color: #0d0d0d;
            border-radius: 14px;
            padding: 10px 12px;
            font-size: 14px;
            outline: none;
        }

        .icons-action-control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            opacity: 0;
            visibility: hidden;
            height: 0;
            overflow: hidden;
            transition: all 0.15s ease;
        }

        .bottom-master-widget.popup-expanded-card {
            border-radius: 24px;
            padding: 16px 20px 14px;
            gap: 14px;
        }

        .bottom-master-widget.popup-expanded-card
        .icons-action-control-row {
            opacity: 1;
            visibility: visible;
            height: 44px;
        }

        .left-icon-utilities-group {
            display: flex;
            align-items: center;
            gap: 36px;
        }

        .plus-action-gray-circle {
            width: 44px;
            height: 44px;
            background-color: #f1f3f8;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            color: #0d0d0d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 300;
            cursor: pointer;
        }

        .utility-svg-action-trigger {
            background: none;
            border: none;
            color: #0d0d0d;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
        }

        .arrow-submit-circle-btn {
            width: 48px;
            height: 44px;
            background-color: #dbe4ff;
            color: #ffffff;
            border: none;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .arrow-submit-circle-btn.typing-active-blue {
            background-color: #1a73e8;
        }

        .user-message {
            align-self: flex-end;
            max-width: 80%;
            margin: 8px 0;
            padding: 10px 14px;
            background: #1a73e8;
            color: #ffffff;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .ai-message {
            align-self: flex-start;
            width: 100%;
            max-width: 760px;
            margin: 12px 0;
            padding: 4px 0;
            color: #202124;
            font-size: 15px;
            line-height: 1.65;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .ai-message strong {
            color: #1a73e8;
            font-weight: 700;
        }

        .ai-message h3 {
            color: #1a73e8;
            margin: 8px 0 5px;
        }

        .ai-thinking {
            align-self: flex-start;
            display: none;
            align-items: center;
            gap: 8px;
            margin: 10px 0;
            color: #777777;
            font-size: 14px;
        }

        .ai-thinking.visible {
            display: flex;
        }

        .thinking-spinner {
            width: 20px;
            height: 20px;
            border: 3px solid #e5e5ea;
            border-top: 3px solid #1a73e8;
            border-radius: 50%;
            animation: thinkingRotate 0.8s linear infinite;
        }

        @keyframes thinkingRotate {
            100% {
                transform: rotate(360deg);
            }
        }

        .ai-error {
            align-self: flex-start;
            width: 100%;
            color: #d93025;
            font-size: 14px;
            line-height: 1.5;
            margin: 10px 0;
        }

        @media (max-width: 480px) {

            .welcome-title {
                font-size: 26px;
            }

            .welcome-subtitle {
                font-size: 13px;
                margin-bottom: 20px;
            }

            .feature-list {
                max-width: 350px;
            }

            .feature-item {
                height: 42px;
            }

        }

    </style>
</head>

<body>

    <div
        class="chat-space-viewport"
        id="chatViewport"
    >

        <div
            class="welcome-screen"
            id="welcomeScreen"
        >

            <div class="welcome-title">
                What can I help you with?
            </div>

            <div class="welcome-subtitle">
                Ask anything, explore ideas, learn something new,
                or get help with your work.
            </div>

            <div class="feature-list">

                <div class="feature-item">
                    <span class="feature-icon">✨</span>
                    <span class="feature-text">
                        Create something
                    </span>
                    <span class="feature-arrow">›</span>
                </div>

                <div class="feature-item">
                    <span class="feature-icon">📚</span>
                    <span class="feature-text">
                        Learn something
                    </span>
                    <span class="feature-arrow">›</span>
                </div>

                <div class="feature-item">
                    <span class="feature-icon">💡</span>
                    <span class="feature-text">
                        Get ideas
                    </span>
                    <span class="feature-arrow">›</span>
                </div>

                <div class="feature-item">
                    <span class="feature-icon">💻</span>
                    <span class="feature-text">
                        Help with coding
                    </span>
                    <span class="feature-arrow">›</span>
                </div>

            </div>

        </div>

        <div
            class="ai-thinking"
            id="aiThinking"
        >

            <div class="thinking-spinner"></div>

            <span>Thinking...</span>

        </div>

    </div>


    <div class="input-panel-wrapper">

        <div
            class="bottom-master-widget"
            id="mainWidgetCard"
        >

            <div
                class="model-selector"
                id="modelSelectorBox"
            >

                <select
                    class="model-select"
                    id="modelSelect"
                >

                    <option value="gemini-3.8-flash">
                        Gemini 3.8 Flash
                    </option>

                    <option value="gemini-3.7-flash">
                        Gemini 3.7 Flash
                    </option>

                    <option value="gemini-3.6-flash">
                        Gemini 3.6 Flash
                    </option>

                </select>

            </div>

            <div class="text-field-container">

                <input
                    type="text"
                    class="chat-main-input"
                    id="chatInputField"
                    placeholder="Ask anything"
                    autocomplete="off"
                >

            </div>

            <div class="icons-action-control-row">

                <div class="left-icon-utilities-group">

                    <button
                        class="plus-action-gray-circle"
                        type="button"
                        id="plusButton"
                    >
                        +
                    </button>

                    <button
                        class="utility-svg-action-trigger"
                        type="button"
                    >

                        <svg
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <path
                                d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"
                            ></path>

                            <path
                                d="M19 10v1a7 7 0 0 1-14 0v-1"
                            ></path>

                            <line
                                x1="12"
                                y1="19"
                                x2="12"
                                y2="22"
                            ></line>

                        </svg>

                    </button>

                    <button
                        class="utility-svg-action-trigger"
                        type="button"
                    >

                        <svg
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <path
                                d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
                            ></path>

                            <circle
                                cx="12"
                                cy="13"
                                r="4"
                            ></circle>

                        </svg>

                    </button>

                </div>

                <button
                    class="arrow-submit-circle-btn"
                    id="arrowSubmitBtn"
                    type="button"
                >

                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <line
                            x1="12"
                            y1="19"
                            x2="12"
                            y2="5"
                        ></line>

                        <polyline
                            points="5 12 12 5 19 12"
                        ></polyline>

                    </svg>

                </button>

            </div>

        </div>

    </div>


    <!-- =====================================================
         FIREBASE + PINGME AI
         Firebase AI Logic Web SDK
         ===================================================== -->

    <script type="module">

        /*
        =====================================================
        🔑 FIREBASE CONFIG / CHABIR JAYGA

        নিচের firebaseConfig-এর ভিতরে Firebase Console
        থেকে পাওয়া Web app-এর config বসাবি।

        নিজের আসল config এখানে বসাবি।
        =====================================================
        */

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

        import {
            getAI,
            getGenerativeModel,
            GoogleAIBackend
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-ai.js";


        const firebaseConfig = {

            /* 🔑 API KEY — Firebase Web Config থেকে বসাবি */
            apiKey: "PASTE_YOUR_FIREBASE_WEB_API_KEY_HERE",

            /* 🔑 Firebase configuration */
            authDomain:
                "pingme-ai-8d8cc.firebaseapp.com",

            projectId:
                "pingme-ai-8d8cc",

            storageBucket:
                "pingme-ai-8d8cc.firebasestorage.app",

            messagingSenderId:
                "547217020747",

            appId:
                "1:547217020747:web:62b7d3843672703d8abace",

            measurementId:
                "G-3WRC64CRDR"
        };


        /*
        =====================================================
        FIREBASE INITIALIZE
        =====================================================
        */

        const firebaseApp =
            initializeApp(firebaseConfig);


        /*
        =====================================================
        FIREBASE AI LOGIC
        Gemini Developer API backend
        =====================================================
        */

        const ai =
            getAI(
                firebaseApp,
                {
                    backend:
                        new GoogleAIBackend()
                }
            );


        /*
        =====================================================
        MAIN ELEMENTS
        =====================================================
        */

        const chatInputField =
            document.getElementById(
                "chatInputField"
            );

        const mainWidgetCard =
            document.getElementById(
                "mainWidgetCard"
            );

        const arrowSubmitBtn =
            document.getElementById(
                "arrowSubmitBtn"
            );

        const modelSelectorBox =
            document.getElementById(
                "modelSelectorBox"
            );

        const plusButton =
            document.getElementById(
                "plusButton"
            );

        const chatViewport =
            document.getElementById(
                "chatViewport"
            );

        const welcomeScreen =
            document.getElementById(
                "welcomeScreen"
            );

        const aiThinking =
            document.getElementById(
                "aiThinking"
            );

        const modelSelect =
            document.getElementById(
                "modelSelect"
            );


        /*
        =====================================================
        CONVERSATION HISTORY
        =====================================================
        */

        let conversationHistory = [];


        /*
        =====================================================
        SELECTED MODEL MEMORY
        =====================================================
        */

        let selectedActiveModel =
            localStorage.getItem(
                "pingme_selected_model"
            ) ||
            modelSelect.value;


        modelSelect.value =
            selectedActiveModel;


        modelSelect.addEventListener(
            "change",
            () => {

                selectedActiveModel =
                    modelSelect.value;

                localStorage.setItem(
                    "pingme_selected_model",
                    selectedActiveModel
                );

            }
        );


        /*
        =====================================================
        INPUT FOCUS
        =====================================================
        */

        chatInputField.addEventListener(
            "focus",
            () => {

                mainWidgetCard.classList.add(
                    "popup-expanded-card"
                );

                modelSelectorBox.classList.add(
                    "visible"
                );

            }
        );


        /*
        =====================================================
        INPUT TYPING
        =====================================================
        */

        chatInputField.addEventListener(
            "input",
            () => {

                if (
                    chatInputField.value.trim() !== ""
                ) {

                    arrowSubmitBtn.classList.add(
                        "typing-active-blue"
                    );

                } else {

                    arrowSubmitBtn.classList.remove(
                        "typing-active-blue"
                    );

                }

            }
        );


        /*
        =====================================================
        ENTER TO SEND
        =====================================================
        */

        chatInputField.addEventListener(
            "keydown",
            (event) => {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    sendMessage();

                }

            }
        );


        /*
        =====================================================
        CLICK OUTSIDE
        =====================================================
        */

        document.addEventListener(
            "click",
            (event) => {

                if (
                    !mainWidgetCard.contains(
                        event.target
                    ) &&
                    chatInputField.value.trim() === ""
                ) {

                    mainWidgetCard.classList.remove(
                        "popup-expanded-card"
                    );

                    modelSelectorBox.classList.remove(
                        "visible"
                    );

                }

            }
        );


        /*
        =====================================================
        PLUS BUTTON
        =====================================================
        */

        plusButton.addEventListener(
            "click",
            () => {

                mainWidgetCard.classList.toggle(
                    "popup-expanded-card"
                );

                modelSelectorBox.classList.toggle(
                    "visible"
                );

            }
        );


        /*
        =====================================================
        SEND BUTTON
        =====================================================
        */

        arrowSubmitBtn.addEventListener(
            "click",
            () => {

                sendMessage();

            }
        );


        /*
        =====================================================
        SEND MESSAGE
        =====================================================
        */

        async function sendMessage() {

            const message =
                chatInputField.value.trim();


            if (message === "") {
                return;
            }


            /*
            WELCOME HIDE
            */

            welcomeScreen.style.display =
                "none";


            /*
            USER MESSAGE
            */

            addUserMessage(
                message
            );


            /*
            SAVE USER MESSAGE
            */

            conversationHistory.push({

                role: "user",

                parts: [
                    {
                        text: message
                    }
                ]

            });


            /*
            CLEAR INPUT
            */

            chatInputField.value = "";

            arrowSubmitBtn.classList.remove(
                "typing-active-blue"
            );


            /*
            SHOW THINKING
            */

            aiThinking.classList.add(
                "visible"
            );


            scrollToBottom();


            try {

                const aiReply =
                    await getGeminiReply();


                aiThinking.classList.remove(
                    "visible"
                );


                /*
                AI MESSAGE
                */

                addAIMessage(
                    aiReply
                );


                /*
                SAVE AI MESSAGE
                */

                conversationHistory.push({

                    role: "model",

                    parts: [
                        {
                            text: aiReply
                        }
                    ]

                );


            } catch (error) {

                aiThinking.classList.remove(
                    "visible"
                );


                addAIError(
                    error.message
                );

            }


            scrollToBottom();

        }


        /*
        =====================================================
        FIREBASE AI LOGIC REQUEST
        =====================================================
        */

        async function getGeminiReply() {

            const selectedModel =
                modelSelect.value;


            if (
                !selectedModel
            ) {

                throw new Error(
                    "No AI model selected."
                );

            }


            /*
            Create the Firebase AI Logic model
            using the model selected in the UI.
            */

            const model =
                getGenerativeModel(
                    ai,
                    {
                        model:
                            selectedModel
                    }
                );


            /*
            Send the complete conversation history.
            */

            const result =
                await model.generateContent(
                    conversationHistory
                );


            const response =
                result.response;


            const reply =
                response.text();


            if (
                !reply ||
                reply.trim() === ""
            ) {

                throw new Error(
                    "Gemini returned an empty response."
                );

            }


            return reply;

        }


        /*
        =====================================================
        ADD USER MESSAGE
        =====================================================
        */

        function addUserMessage(
            text
        ) {

            const messageBox =
                document.createElement(
                    "div"
                );


            messageBox.className =
                "user-message";


            messageBox.textContent =
                text;


            chatViewport.appendChild(
                messageBox
            );


            scrollToBottom();

        }


        /*
        =====================================================
        ADD AI MESSAGE
        =====================================================
        */

        function addAIMessage(
            text
        ) {

            const messageBox =
                document.createElement(
                    "div"
                );


            messageBox.className =
                "ai-message";


            messageBox.innerHTML =
                formatAIResponse(
                    text
                );


            chatViewport.appendChild(
                messageBox
            );


            scrollToBottom();

        }


        /*
        =====================================================
        AI RESPONSE FORMAT
        =====================================================
        */

        function formatAIResponse(
            text
        ) {

            const safeText =
                escapeHTML(
                    text
                );


            let formatted =
                safeText;


            formatted =
                formatted.replace(
                    /\*\*(.*?)\*\*/g,
                    "<strong>$1</strong>"
                );


            formatted =
                formatted.replace(
                    /^### (.*)$/gm,
                    "<h3>$1</h3>"
                );


            formatted =
                formatted.replace(
                    /^## (.*)$/gm,
                    "<h3>$1</h3>"
                );


            formatted =
                formatted.replace(
                    /^# (.*)$/gm,
                    "<h3>$1</h3>"
                );


            return formatted;

        }


        /*
        =====================================================
        ESCAPE HTML
        =====================================================
        */

        function escapeHTML(
            text
        ) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                text;


            return div.innerHTML;

        }


        /*
        =====================================================
        ERROR
        =====================================================
        */

        function addAIError(
            message
        ) {

            const errorBox =
                document.createElement(
                    "div"
                );


            errorBox.className =
                "ai-error";


            errorBox.textContent =
                "AI reply error: " +
                message;


            chatViewport.appendChild(
                errorBox
            );


            scrollToBottom();

        }


        /*
        =====================================================
        SCROLL
        =====================================================
        */

        function scrollToBottom() {

            setTimeout(
                () => {

                    chatViewport.scrollTop =
                        chatViewport.scrollHeight;

                },
                50
            );

        }

    </script>

</body>
</html>
