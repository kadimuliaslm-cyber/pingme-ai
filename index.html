<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>PingMe AI</title>

<style>
*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:#050505;
 color:#fff;
 font-family:Arial,"Noto Sans Bengali",sans-serif;
 height:100vh;
 display:flex;
 flex-direction:column;
 overflow:hidden;
}

/* HEADER */

.header{
 background:linear-gradient(135deg,#101010,#151515);
 padding:14px 12px;
 text-align:center;
 border-bottom:1px solid #242424;
}

.header h1{
 margin:0;
 color:#00ff88;
 font-size:24px;
}

.header p{
 margin:5px 0 0;
 font-size:11px;
 opacity:.55;
}

/* SETUP */

#setup{
 padding:28px 18px;
 text-align:center;
 background:#101010;
 overflow:auto;
}

#setup h2{
 color:#00ff88;
 margin-top:0;
}

#apiKeyInput{
 width:100%;
 padding:14px;
 background:#222;
 border:1px solid #333;
 color:#fff;
 border-radius:12px;
 outline:none;
 margin:12px 0;
}

.saveBtn{
 background:#00ff88;
 color:#000;
 border:0;
 padding:13px 25px;
 border-radius:12px;
 font-weight:bold;
 cursor:pointer;
}

/* CHAT */

#chat{
 flex:1;
 overflow-y:auto;
 padding:15px;
 display:flex;
 flex-direction:column;
 gap:12px;
 scroll-behavior:smooth;
}

.msg{
 max-width:88%;
 padding:12px 15px;
 border-radius:17px;
 font-size:14px;
 line-height:1.6;
 white-space:pre-wrap;
 word-wrap:break-word;
 box-shadow:0 2px 8px rgba(0,0,0,.2);
}

.user{
 background:#00ff88;
 color:#000;
 align-self:flex-end;
 border-bottom-right-radius:5px;
}

.ai{
 background:#1b1b1b;
 color:#fff;
 align-self:flex-start;
 border-bottom-left-radius:5px;
}

.msg img{
 width:100%;
 max-width:500px;
 display:block;
 border-radius:13px;
 margin-top:8px;
}

.typing{
 opacity:.65;
 font-style:italic;
}

/* STATUS */

.status{
 text-align:center;
 padding:4px;
 font-size:10px;
 opacity:.5;
 background:#090909;
}

/* INPUT */

.input-area{
 background:#101010;
 border-top:1px solid #252525;
 padding:9px;
 display:flex;
 gap:7px;
 align-items:center;
}

#userInput{
 flex:1;
 min-width:0;
 background:#222;
 color:#fff;
 border:1px solid #333;
 outline:none;
 padding:13px 15px;
 border-radius:23px;
 font-size:14px;
}

.iconBtn{
 width:44px;
 height:44px;
 flex-shrink:0;
 border:0;
 border-radius:50%;
 background:#222;
 color:#fff;
 font-size:18px;
 cursor:pointer;
}

.sendBtn{
 background:#00ff88;
 color:#000;
 font-weight:bold;
}

/* BOTTOM */

.bottomBar{
 display:flex;
 justify-content:center;
 gap:8px;
 padding:7px;
 background:#101010;
}

.smallBtn{
 background:#1c1c1c;
 color:#bbb;
 border:1px solid #333;
 padding:7px 12px;
 border-radius:10px;
 font-size:11px;
}

.hidden{
 display:none!important;
}

/* IMAGE */

.imageTitle{
 font-size:12px;
 opacity:.7;
 margin-bottom:6px;
}

/* VOICE */

.voiceListening{
 background:#ff3366!important;
 animation:pulse 1s infinite;
}

@keyframes pulse{
 0%{transform:scale(1)}
 50%{transform:scale(1.08)}
 100%{transform:scale(1)}
}
</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

<h1>PingMe AI 🟢</h1>

<p>
Smart Chat • Voice • Image • Multilingual AI
</p>

</div>


<!-- API SETUP -->

<div id="setup">

<h2>Welcome to PingMe AI 🤖</h2>

<p style="font-size:13px;opacity:.7;line-height:1.6">

আপনার Gemini API Key দিন।<br>
Key এই ব্রাউজারে সংরক্ষণ করা হবে।

</p>

<input
 id="apiKeyInput"
 type="password"
 placeholder="AIza..."
>

<br>

<button
 class="saveBtn"
 onclick="saveKey()"
>
Connect PingMe AI
</button>

<p style="font-size:11px;opacity:.45;margin-top:15px">
API key কারো সাথে শেয়ার করবেন না।
</p>

</div>


<!-- CHAT -->

<div id="chat" class="hidden"></div>


<!-- STATUS -->

<div id="status" class="status hidden">
PingMe AI Ready
</div>


<!-- INPUT -->

<div id="inputArea" class="input-area hidden">

<button
 id="micButton"
 class="iconBtn"
 onclick="startVoice()"
 title="Voice input"
>
🎤
</button>

<input
 id="userInput"
 placeholder="আপনার কথা লিখুন..."
 autocomplete="off"
>

<button
 class="iconBtn sendBtn"
 onclick="sendMessage()"
>
➤
</button>

</div>


<!-- BOTTOM -->

<div id="bottomBar" class="bottomBar hidden">

<button
 class="smallBtn"
 onclick="clearChat()"
>
🗑 Chat Clear
</button>

<button
 class="smallBtn"
 onclick="toggleVoice()"
>
🔊 Voice On/Off
</button>

</div>


<script>

/* =====================================================
   PINGME AI CONFIGURATION
===================================================== */

let API_KEY =
localStorage.getItem("pingme_gemini_key");

const TEXT_MODEL =
"gemini-2.5-flash";

const IMAGE_MODEL =
"gemini-2.5-flash-image";


let inactivityTimer=null;

let voiceEnabled=true;

let recognition=null;

let conversation=[];


/* =====================================================
   FOLLOW UP MESSAGES
===================================================== */

const followUps=[

 "কোথায় গেলেন? আমি এখানেই আছি। 😊",

 "মেসেজ দিয়ে চুপ হয়ে গেলেন কেন? 😄",

 "আর কিছু জানতে চাইলে বলতে পারেন।",

 "আমি এখনও আপনার সাথে আড্ডা দিতে প্রস্তুত। 😊",

 "আপনি কি ফিরে এসেছেন? আমি অপেক্ষা করছি।"

];


/* =====================================================
   AI PERSONALITY
===================================================== */

const SYSTEM_PROMPT=`

You are PingMe AI.

You are a helpful, intelligent, friendly and respectful AI assistant.

IMPORTANT LANGUAGE RULES:

1. Always understand the user's language.
2. Normally reply in the same language as the user.
3. If the user speaks Bengali, reply in natural Bengali.
4. If the user speaks English, reply in English.
5. You may communicate in many languages.

IMPORTANT ADDRESSING RULE:

At the beginning, use polite language such as "আপনি".

Observe how the user talks to you.

If the user consistently uses friendly "তুমি" language and clearly treats you like a friend, you may naturally use "তুমি".

If the user clearly uses "তুই" in a friendly way and the conversation becomes close and informal, you may use "তুই".

If you are unsure, always use "আপনি".

Never become rude, insulting or disrespectful.

IMPORTANT MEMORY RULE:

Remember the conversation context provided to you.

Use previous messages to understand what the user is talking about.

Do not randomly change the user's language or relationship style.

IMPORTANT ANSWER QUALITY:

Give accurate, clear and useful answers.

Do not invent facts.

If you do not know something, say that you are not sure.

Never intentionally give nonsense or random answers.

Do not repeat the same answer unnecessarily.

Keep answers natural and conversational.

VOICE RULE:

Your answer will sometimes be read aloud.

Therefore:

- Use natural sentences.
- Avoid excessive symbols.
- Avoid unnecessary emojis.
- Avoid complicated formatting.
- Do not use markdown tables unless necessary.
- Do not use strange characters.
- Write pronunciation-friendly sentences.

IMAGE RULE:

If the user asks to generate an image, the application may use the image-generation feature.

Be clear about what image is being requested.

PERSONALITY:

Friendly, calm, intelligent, helpful and natural.

Never pretend to be a human.

`;


/* =====================================================
   STARTUP
===================================================== */

if(API_KEY){

 showChat();

 loadHistory();

}


/* =====================================================
   SAVE API KEY
===================================================== */

function saveKey(){

 const key=
 document.getElementById("apiKeyInput")
 .value.trim();

 if(!key){

  alert("Gemini API Key দিন।");

  return;
 }

 localStorage.setItem(
  "pingme_gemini_key",
  key
 );

 API_KEY=key;

 showChat();

 if(conversation.length===0){

  addMessage(

`হ্যালো! আমি PingMe AI।

আপনি আমার সাথে কথা বলতে পারেন, ভয়েসে কথা বলতে পারেন এবং ছবি তৈরি করতে বলতে পারেন।

আপনি চাইলে ধীরে ধীরে আমার সাথে বন্ধুর মতোও কথা বলতে পারেন। 😊`,

  "ai",

  true

  );

 }

}


/* =====================================================
   SHOW CHAT
===================================================== */

function showChat(){

 document
 .getElementById("setup")
 .classList.add("hidden");

 document
 .getElementById("chat")
 .classList.remove("hidden");

 document
 .getElementById("inputArea")
 .classList.remove("hidden");

 document
 .getElementById("bottomBar")
 .classList.remove("hidden");

 document
 .getElementById("status")
 .classList.remove("hidden");

}


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(
 text,
 type,
 save=true
){

 const chat=
 document.getElementById("chat");

 const message=
 document.createElement("div");

 message.className=
 "msg "+type;

 message.textContent=text;

 chat.appendChild(message);

 chat.scrollTop=
 chat.scrollHeight;


 if(save){

  conversation.push({

   role:type,

   text:text

  });

  saveHistory();

 }

 resetInactivityTimer();

 return message;

}


/* =====================================================
   ADD IMAGE
===================================================== */

function addImageMessage(
 base64,
 mimeType="image/png"
){

 const chat=
 document.getElementById("chat");

 const box=
 document.createElement("div");

 box.className="msg ai";

 const title=
 document.createElement("div");

 title.className="imageTitle";

 title.textContent=
 "🎨 AI Generated Image";

 box.appendChild(title);


 const image=
 document.createElement("img");

 image.src=
 "data:"+mimeType+
 ";base64,"+base64;

 box.appendChild(image);

 chat.appendChild(box);

 chat.scrollTop=
 chat.scrollHeight;

 resetInactivityTimer();

}


/* =====================================================
   SAVE HISTORY
===================================================== */

function saveHistory(){

 try{

  localStorage.setItem(

   "pingme_history",

   JSON.stringify(
    conversation.slice(-100)
   )

  );

 }catch(error){}

}


/* =====================================================
   LOAD HISTORY
===================================================== */

function loadHistory(){

 try{

  const saved=
  localStorage.getItem(
   "pingme_history"
  );

  if(!saved){

   conversation=[];

   return;
  }

  conversation=
  JSON.parse(saved);

  renderHistory();

 }catch(error){

  conversation=[];

 }

}


/* =====================================================
   RENDER HISTORY
===================================================== */

function renderHistory(){

 const chat=
 document.getElementById("chat");

 chat.innerHTML="";

 conversation.forEach(item=>{

  const message=
  document.createElement("div");

  message.className=
  "msg "+item.role;

  message.textContent=
  item.text;

  chat.appendChild(message);

 });

 chat.scrollTop=
 chat.scrollHeight;

 resetInactivityTimer();

}


/* =====================================================
   CLEAR CHAT
===================================================== */

function clearChat(){

 const ok=
 confirm(
  "এই ডিভাইসের PingMe AI chat history মুছে ফেলবেন?"
 );

 if(!ok)return;

 conversation=[];

 localStorage.removeItem(
  "pingme_history"
 );

 document
 .getElementById("chat")
 .innerHTML="";

 addMessage(

  "নতুন chat শুরু হয়েছে। আমি প্রস্তুত। 😊",

  "ai",

  true

 );

}


/* =====================================================
   1 MINUTE FOLLOW UP
===================================================== */

function resetInactivityTimer(){

 clearTimeout(
  inactivityTimer
 );

 inactivityTimer=
 setTimeout(()=>{

  const message=
  followUps[
   Math.floor(
    Math.random()*followUps.length
   )
  ];

  addMessage(
   message,
   "ai",
   true
  );

  speakText(message);

 },60000);

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

 const input=
 document.getElementById(
  "userInput"
 );

 const text=
 input.value.trim();

 if(!text)return;

 input.value="";

 clearTimeout(
  inactivityTimer
 );

 addMessage(
  text,
  "user",
  true
 );


 /* IMAGE REQUEST CHECK */

 const lower=
 text.toLowerCase();

 const imageWords=[

  "ছবি বানাও",
  "ছবি বানিয়ে",
  "ছবি তৈরি",
  "ছবি বানিয়ে দাও",
  "একটা ছবি",
  "image",
  "generate image",
  "create image",
  "make image",
  "draw",
  "picture",
  "photo"

 ];


 const wantsImage=
 imageWords.some(
  word=>lower.includes(word)
 );


 if(wantsImage){

  await generateImage(text);

  return;

 }


 await askAI(text);

}


/* =====================================================
   ASK GEMINI
===================================================== */

async function askAI(text){

 const loading=
 addMessage(
  "ভাবছি...",
  "ai",
  false
 );

 loading.classList.add(
  "typing"
 );


 try{

  const contents=
  conversation
  .slice(-20)
  .map(item=>({

   role:
   item.role==="user"
   ? "user"
   : "model",

   parts:[
    {
     text:item.text
    }
   ]

  }));


  const response=
  await fetch(

   "https://generativelanguage.googleapis.com/v1beta/models/"
   +TEXT_MODEL+
   ":generateContent?key="
   +encodeURIComponent(API_KEY),

   {

    method:"POST",

    headers:{
     "Content-Type":
     "application/json"
    },

    body:JSON.stringify({

     systemInstruction:{

      parts:[
       {
        text:SYSTEM_PROMPT
       }
      ]

     },

     contents:contents,

     generationConfig:{

      temperature:0.65,

      topP:0.9,

      maxOutputTokens:2048

     }

    })

   }

  );


  const data=
  await response.json();

  loading.remove();


  if(!response.ok){

   addMessage(

    "API Error: "+
    (
     data?.error?.message
     ||
     "Unknown error"
    ),

    "ai",

    true

   );

   return;

  }


  const reply=
  data
  ?.candidates?.[0]
  ?.content?.parts
  ?.map(
   part=>part.text || ""
  )
  .join("")
  .trim();


  if(!reply){

   addMessage(
    "দুঃখিত, এই মুহূর্তে কোনো উত্তর পাওয়া যায়নি। আবার চেষ্টা করুন।",
    "ai",
    true
   );

   return;

  }


  addMessage(
   reply,
   "ai",
   true
  );


  speakText(reply);


 }catch(error){

  loading.remove();

  addMessage(

   "ইন্টারনেট অথবা API সংযোগে সমস্যা হয়েছে। একটু পরে আবার চেষ্টা করুন।",

   "ai",

   true

  );

 }

}


/* =====================================================
   IMAGE GENERATION
===================================================== */

async function generateImage(prompt){

 const loading=
 addMessage(

  "🎨 আপনার ছবিটি তৈরি করছি...",

  "ai",

  false

 );

 loading.classList.add(
  "typing"
 );


 try{

  const response=
  await fetch(

   "https://generativelanguage.googleapis.com/v1beta/models/"
   +IMAGE_MODEL+
   ":generateContent?key="
   +encodeURIComponent(API_KEY),

   {

    method:"POST",

    headers:{
     "Content-Type":
     "application/json"
    },

    body:JSON.stringify({

     contents:[

      {

       parts:[

        {
         text:
         "Generate a high quality image based on this request: "
         +prompt
        }

       ]

      }

     ],

     generationConfig:{

      responseModalities:[
       "TEXT",
       "IMAGE"
      ]

     }

    })

   }

  );


  const data=
  await response.json();

  loading.remove();


  if(!response.ok){

   addMessage(

    "ছবি তৈরি করতে সমস্যা হয়েছে:\n"+
    (
     data?.error?.message
     ||
     "Image generation error"
    ),

    "ai",

    true

   );

   return;

  }


  const parts=
  data
  ?.candidates?.[0]
  ?.content?.parts
  ||
  [];


  let imageFound=false;


  for(
   const part of parts
  ){

   if(
    part.inlineData
   ){

    addImageMessage(

     part.inlineData.data,

     part.inlineData.mimeType
     ||
     "image/png"

    );

    imageFound=true;

    break;

   }

  }


  if(!imageFound){

   const text=
   parts
   .map(
    p=>p.text || ""
   )
   .join("")
   .trim();


   addMessage(

    text
    ||
    "ছবিটি তৈরি করা যায়নি। আবার চেষ্টা করুন।",

    "ai",

    true

   );

  }


 }catch(error){

  loading.remove();

  addMessage(

   "ছবি তৈরি করতে সংযোগে সমস্যা হয়েছে। API Key এবং Internet connection পরীক্ষা করুন।",

   "ai",

   true

  );

 }

}


/* =====================================================
   VOICE INPUT
===================================================== */

function startVoice(){

 const SpeechRecognition=
 window.SpeechRecognition
 ||
 window.webkitSpeechRecognition;


 if(!SpeechRecognition){

  alert(
   "আপনার browser voice input support করছে না। Chrome ব্যবহার করে দেখুন।"
  );

  return;

 }


 if(recognition){

  try{
   recognition.stop();
  }catch(e){}

 }


 recognition=
 new SpeechRecognition();


 recognition.continuous=false;

 recognition.interimResults=false;

 /*
  Bengali first.
  Browser can still recognize other languages
  depending on device/browser.
 */

 recognition.lang=
 "bn-BD";


 const mic=
 document.getElementById(
  "micButton"
 );


 recognition.onstart=()=>{

  mic.classList.add(
   "voiceListening"
  );

  document
  .getElementById("status")
  .textContent=
  "🎤 শুনছি... কথা বলুন";

 };


 recognition.onresult=
 event=>{

  const transcript=
  event
  .results[0][0]
  .transcript;

  document
  .getElementById("userInput")
  .value=
  transcript;

  mic.classList.remove(
   "voiceListening"
  );

  sendMessage();

 };


 recognition.onerror=
 event=>{

  mic.classList.remove(
   "voiceListening"
  );

  document
  .getElementById("status")
  .textContent=
  "Voice input error";

 };


 recognition.onend=()=>{

  mic.classList.remove(
   "voiceListening"
  );

  document
  .getElementById("status")
  .textContent=
  "PingMe AI Ready";

 };


 recognition.start();

}


/* =====================================================
   FEMALE VOICE SELECTION
===================================================== */

function chooseFemaleVoice(language){

 const voices=
 window.speechSynthesis
 ?.getVoices()
 ||
 [];


 if(!voices.length)
 return null;


 const langCode=
 language.split("-")[0]
 .toLowerCase();


 const matching=
 voices.filter(
  voice=>
  voice.lang
  .toLowerCase()
  .startsWith(langCode)
 );


 if(!matching.length)
 return null;


 /*
  Try to find female-sounding
  voice names first.
 */

 const femaleKeywords=[

  "female",
  "woman",
  "girl",
  "samantha",
  "zira",
  "susan",
  "karen",
  "moira",
  "victoria",
  "aria",
  "jenny",
  "sara",
  "google uk english female",
  "google us english female"

 ];


 for(
  const keyword
  of femaleKeywords
 ){

  const found=
  matching.find(
   voice=>
   voice.name
   .toLowerCase()
   .includes(keyword)
  );

  if(found)
  return found;

 }


 /*
  If the browser does not
  expose gender information,
  use the first matching voice.
 */

 return matching[0];

}


/* =====================================================
   LANGUAGE DETECTION
===================================================== */

function detectLanguage(text){

 if(
  /[\u0980-\u09FF]/
  .test(text)
 )
 return "bn-BD";


 if(
  /[\u0900-\u097F]/
  .test(text)
 )
 return "hi-IN";


 if(
  /[\u0600-\u06FF]/
  .test(text)
 )
 return "ar-SA";


 if(
  /[\u0400-\u04FF]/
  .test(text)
 )
 return "ru-RU";


 if(
  /[\u4E00-\u9FFF]/
  .test(text)
 )
 return "zh-CN";


 if(
  /[\u3040-\u30FF]/
  .test(text)
 )
 return "ja-JP";


 if(
  /[\uAC00-\uD7AF]/
  .test(text)
 )
 return "ko-KR";


 if(
  /[\u0E00-\u0E7F]/
  .test(text)
 )
 return "th-TH";


 return "en-US";

}


/* =====================================================
   TEXT TO SPEECH
===================================================== */

function speakText(text){

 if(!voiceEnabled)
 return;


 if(
  !("speechSynthesis" in window)
 )
 return;


 window
 .speechSynthesis
 .cancel();


 /*
  Remove markdown and strange
  formatting before speech.
 */

 let clean=
 text
 .replace(/```[\s\S]*?```/g,"")
 .replace(/[*#_~]/g,"")
 .replace(/\[([^\]]+)\]\([^)]+\)/g,"$1")
 .replace(/\s+/g," ")
 .trim();


 if(!clean)
 return;


 /*
  Keep speech reasonable.
 */

 clean=
 clean.substring(0,2500);


 const language=
 detectLanguage(clean);


 const utterance=
 new SpeechSynthesisUtterance(
  clean
 );


 utterance.lang=
 language;


 /*
  Natural spea
  <!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PingMe AI</title>
<style>body{background:#000;color:#0f0;text-align:center;padding:20px;font-family:sans-serif}input{width:90%;padding:12px;border-radius:8px}button{padding:12px 20px;background:#0f0;border:0;margin-top:10px;border-radius:8px;font-weight:bold}</style>
</head>
<body>
<h2>PingMe AI 🟢</h2>
<p>Gemini API Key দিন</p>
<input id="k" placeholder="API Key here">
<br>
<button onclick="go()">Connect PingMe AI</button>
<script>
function go(){
  var v=document.getElementById('k').value.trim();
  if(!v){alert('Key দিন');return;}
  localStorage.setItem('key',v);
  localStorage.setItem('gemini_key',v);
  alert('Connected! Reload হচ্ছে');
  location.reload();
}
if(localStorage.getItem('key')){
  document.body.innerHTML='<h2>Connected ✅</h2><p>Key: '+localStorage.getItem('key').slice(0,12)+'...</p><a href=\"https://kadimulashim-cyber.github.io/pingme-ai/\" style=\"color:#0f0\">Chat শুরু করুন</a><br><br><button onclick=\"localStorage.clear();location.reload()\">Logout</button>';
}
</script>
</body>
</html>
