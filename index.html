<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PingMe AI</title>
                  <link rel="manifest" href="manifest.json">
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff;
}

body {
    display: flex;
    flex-direction: column;
}

.chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
}

.welcome {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.title {
    font-size: 27px;
    font-weight: 600;
    color: #111;
    text-align: center;
}

.subtitle {
    margin-top: 8px;
    margin-bottom: 24px;
    max-width: 330px;
    text-align: center;
    font-size: 14px;
    line-height: 1.5;
    color: #777;
}

.features {
    width: 100%;
    max-width: 360px;
}

.feature {
    height: 44px;
    margin-bottom: 8px;
    padding: 0 13px;
    border: 1px solid #e5e5ea;
    border-radius: 12px;
    display: flex;
    align-items: center;
}

.feature-icon {
    width: 28px;
    font-size: 17px;
}

.feature-text {
    flex: 1;
    font-size: 14px;
    color: #202124;
}

.arrow {
    font-size: 21px;
    color: #888;
}

.input-area {
    width: 100%;
    padding: 10px 16px 16px;
    border-top: 1px solid #f1f3f4;
    background: #fff;
}

.input-card {
    width: 100%;
    padding: 12px 18px;
    border: 1px solid #e5e5ea;
    border-radius: 30px;
    background: #fff;
    box-shadow: 0 2px 12px rgba(0,0,0,.03);
}

.model-box {
    display: none;
    margin-bottom: 10px;
}

.model-box.show {
    display: block;
}

.model-select {
    width: 100%;
    height: 40px;
    border: 1px solid #e5e5ea;
    border-radius: 13px;
    background: white;
    padding: 0 10px;
    font-size: 14px;
    outline: none;
}

.input-row {
    width: 100%;
}

.input {
    width: 100%;
    height: 38px;
    border: none;
    outline: none;
    font-size: 16px;
}

.input::placeholder {
    color: #777;
}

.action-row {
    width: 100%;
    height: 44px;
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.left-actions {
    display: flex;
    align-items: center;
    gap: 28px;
}

.plus {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: #f1f3f8;
    color: #111;
    font-size: 25px;
    cursor: pointer;
}

.icon-button {
    width: 24px;
    height: 42px;
    border: none;
    background: transparent;
    color: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    cursor: pointer;
}

.send-button {
    width: 46px;
    height: 42px;
    border: none;
    border-radius: 22px;
    background: #dbe4ff;
    color: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.send-button.active {
    background: #1a73e8;
    color: white;
}

.voice-icon {
    display: block;
}

.send-icon {
    display: none;
}

.send-button.active .voice-icon {
    display: none;
}

.send-button.active .send-icon {
    display: block;
}

/* THINKING */

.thinking {
    display: none;
    align-items: center;
    gap: 8px;
    margin: 12px 0;
    color: #777;
    font-size: 14px;
}

.thinking.show {
    display: flex;
}

.spinner {
    width: 20px;
    height: 20px;
    border: 3px solid #e5e5ea;
    border-top-color: #1a73e8;
    border-radius: 50%;
    animation: spin .8s linear infinite;
}

@keyframes spin {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

/* MESSAGES */

.user-message {
    max-width: 80%;
    margin: 8px 0 8px auto;
    padding: 10px 14px;
    border-radius: 18px;
    background: #1a73e8;
    color: white;
    white-space: pre-wrap;
    word-break: break-word;
}

.ai-message {
    width: 100%;
    margin: 12px 0;
    color: #202124;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
}

.ai-message strong {
    color: #1a73e8;
}

.ai-message h3 {
    color: #1a73e8;
    margin: 8px 0 5px;
}

.ai-error {
    width: 100%;
    margin: 10px 0;
    color: #d93025;
    line-height: 1.5;
    font-size: 14px;
}

@media(max-width:480px) {
    .title {
        font-size: 26px;
    }
}
</style>
</head>

<body>

<div class="chat-area" id="chatArea">

    <div class="welcome" id="welcome">

        <div class="title">
            What can I help you with?
        </div>

        <div class="subtitle">
            Ask anything, explore ideas, learn something new,
            or get help with your work.
        </div>

        <div class="features">

            <div class="feature">
                <span class="feature-icon">✨</span>
                <span class="feature-text">Create something</span>
                <span class="arrow">›</span>
            </div>

            <div class="feature">
                <span class="feature-icon">📚</span>

                <span class="arrow">›</span>
            </div>

            <div class="feature">
                <span class="feature-icon">💡</span>
                <span class="feature-text">Get ideas</span>
                <span class="arrow">›</span>
            </div>

            <div class="feature">
                <span class="feature-icon">💻</span>
                <span class="feature-text">Help with coding</span>

            </div>

        </div>

    </div>

    <div class="thinking" id="thinking">
        <div class="spinner"></div>
        <span>Thinking...</span>
    </div>

</div>

<div class="input-area">

    <div class="input-card">

        <div class="model-box" id="modelBox">

            <select class="model-select" id="modelSelect">

                <option value="gemini-3.8-flash">
                    Gemini 3.8 Flash
                </option>

                <option value="gemini-3.6-flash">
                    Gemini 3.6 Flash
                </option>

                <option value="gemini-3.5-flash-lite">
                    Gemini 3.5 Flash-Lite
                </option>
                  
                <option value="openai">OpenAI
                </option>
                </select>

               </div>

        <div class="input-row">
            <input
                id="chatInput"
                class="input"
                type="text"
                placeholder="Ask anything"
                autocomplete="off"
            >
       </div>

        <div class="action-row">

            <div class="left-actions">

                <button
                    class="plus"
                    id="plusButton"
                    type="button"
                >+</button>

                <button
                    class="icon-button"
                    id="micButton"
                    type="button"
                >
                    <svg
                        width="21"
                        height="21"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                        <path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
                        <line x1="12" y1="19" x2="12" y2="22"></line>
                    </svg>
                </button>

                <button
                    class="icon-button"
                    id="cameraButton"
                    type="button"
                >
                    <svg
                        width="21"
                        height="21"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                </button>

            </div>

            <button
                class="send-button"
                id="sendButton"
                type="button"
            >

                <svg
                    class="voice-icon"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                    <path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
                    <line x1="12" y1="19" x2="12" y2="22"></line>
                </svg>

                <svg
                    class="send-icon"
                    width="22"
                    height="22"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <line x1="12" y1="19" x2="12" y2="5"></line>
                    <polyline points="6 11 12 5 18 11"></polyline>
                </svg>

            </button>

        </div>

    </div>

</div>


<!-- FIREBASE + PINGME AI -->

<script type="module">

/* =========================================================
   ১. শুধু এখানে তোর Firebase Web API Key বসাবি
   ========================================================= */

const firebaseConfig = {

    apiKey: "AIzaSyB4dAUhxEao415YdVg4l4WYJ21hQ9V-tyk",

    authDomain: "pingme-ai-8d8cc.firebaseapp.com",

    projectId: "pingme-ai-8d8cc",

    storageBucket: "pingme-ai-8d8cc.firebasestorage.app",

    messagingSenderId: "547217020747",

    appId: "1:547217020747:web:62b7d3843672703d8abace",

    measurementId: "G-3WRC64CRDR"
};


/* =========================================================
   ২. Firebase SDK
   ========================================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAI,
    getGenerativeModel,
    GoogleAIBackend
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-ai.js";


/* =========================================================
   ৩. Firebase শুরু
   ========================================================= */

const firebaseApp = initializeApp(firebaseConfig);

const ai = getAI(
    firebaseApp,
    {
        backend: new GoogleAIBackend()
    }
);


/* =========================================================
   ৪. ELEMENTS
   ========================================================= */

const input =
    document.getElementById("chatInput");

const sendButton =
    document.getElementById("sendButton");

const plusButton =
    document.getElementById("plusButton");

const micButton =
    document.getElementById("micButton");

const cameraButton =
    document.getElementById("cameraButton");

const modelBox =
    document.getElementById("modelBox");

const modelSelect =
    document.getElementById("modelSelect");

const chatArea =
    document.getElementById("chatArea");

const welcome =
    document.getElementById("welcome");

const thinking =
    document.getElementById("thinking");


/* =========================================================
   ৫. CONVERSATION HISTORY
   ========================================================= */

let conversationHistory = [];

let chatSession = null;

let currentChatModel = null;


/* =========================================================
   ৬. MODEL
   ========================================================= */

function createModel(modelName) {

    return getGenerativeModel(
        ai,
        {
            model: modelName
        }
    );
}


/* =========================================================
   ৭. CHAT SESSION
   ========================================================= */

function getChatSession() {

    const selectedModel =
        modelSelect.value;

    if (
        chatSession === null ||
        currentChatModel !== selectedModel
    ) {

        const model =
            createModel(selectedModel);

        chatSession =
            model.startChat({
                history: conversationHistory
            });

        currentChatModel =
            selectedModel;
    }

    return chatSession;
}


/* =========================================================
   ৮. MODEL CHANGE
   ========================================================= */

modelSelect.addEventListener(
    "change",
    function () {

        chatSession = null;

        currentChatModel =
            null;
    }
);


/* =========================================================
   ৯. INPUT CHANGE
   ========================================================= */

input.addEventListener(
    "input",
    function () {

        if (input.value.trim() !== "") {

            sendButton.classList.add(
                "active"
            );

        } else {

            sendButton.classList.remove(
                "active"
            );
        }
    }
);


/* =========================================================
   ১০. INPUT FOCUS
   ========================================================= */

input.addEventListener(
    "focus",
    function () {

        modelBox.classList.add(
            "show"
        );
    }
);


/* =========================================================
   ১১. PLUS
   ========================================================= */

plusButton.addEventListener(
    "click",
    function () {

        modelBox.classList.toggle(
            "show"
        );
    }
);


/* =========================================================
   ১২. ENTER = SEND
   ========================================================= */

input.addEventListener(
    "keydown",
    function (event) {

        if (event.key === "Enter") {

            event.preventDefault();

            if (
                input.value.trim() !== ""
            ) {

                sendMessage();
            }
        }
    }
);


/* =========================================================
   ১৩. SEND BUTTON
   ========================================================= */

sendButton.addEventListener(
    "click",
    function () {

        if (
            input.value.trim() === ""
        ) {

            startVoice();

        } else {

            sendMessage();
        }
    }
);


/* =========================================================
   ১৪. MICROPHONE
   ========================================================= */

micButton.addEventListener(
    "click",
    function () {

        startVoice();
    }
);


/* =========================================================
   ১৫. CAMERA
   ========================================================= */

cameraButton.addEventListener(
    "click",
    function () {

        alert(
            "Camera feature will be added later."
        );
    }
);


/* =========================================================
   ১৬. SEND MESSAGE
   ========================================================= */

async function sendMessage() {

    const message =
        input.value.trim();

    if (message === "") {
        return;
    }


    /* Welcome hide */

    welcome.style.display =
        "none";


    /* User message show */

    addUserMessage(message);


    /* Input clear */

    input.value = "";

    sendButton.classList.remove(
        "active"
    );


    /* Thinking */

    thinking.classList.add(
        "show"
    );

    scrollToBottom();


    try {

        /* Get current chat */

        const chat =
            getChatSession();


        /* Send to Gemini */

        const result =
            await chat.sendMessage(
                message
            );


        /* Get AI response */

        const response =
            result.response;

        const reply =
            response.text();


        /* Save conversation */

        conversationHistory.push({

            role: "user",

            parts: [
                {
                    text: message
                }
            ]

        });


        conversationHistory.push({

            role: "model",

            parts: [
                {
                    text: reply
                }
            ]

        });


        /* Stop thinking */

        thinking.classList.remove(
            "show"
        );


        /* Show AI reply */

        addAIMessage(
            reply
        );


    } catch (error) {

        thinking.classList.remove(
            "show"
        );


        console.error(
            "PingMe AI error:",
            error
        );


        addAIError(
            error.message ||
            "AI reply failed."
        );
    }


    scrollToBottom();
}


/* =========================================================
   ১৭. USER MESSAGE
   ========================================================= */

function addUserMessage(
    message
) {

    const box =
        document.createElement(
            "div"
        );

    box.className =
        "user-message";

    box.textContent =
        message;

    chatArea.appendChild(
        box
    );

    scrollToBottom();
}


/* =========================================================
   ১৮. AI MESSAGE
   ========================================================= */

function addAIMessage(
    message
) {

    const box =
        document.createElement(
            "div"
        );

    box.className =
        "ai-message";

    box.innerHTML =
        formatAIResponse(
            message
        );

    chatArea.appendChild(
        box
    );

    scrollToBottom();
}


/* =========================================================
   ১৯. AI RESPONSE FORMAT
   ========================================================= */

function formatAIResponse(
    text
) {

    const safe =
        escapeHTML(text);

    let result =
        safe;


    /* Bold */

    result =
        result.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );


    /* Headings */

    result =
        result.replace(
            /^### (.*)$/gm,
            "<h3>$1</h3>"
        );

    result =
        result.replace(
            /^## (.*)$/gm,
            "<h3>$1</h3>"
        );

    result =
        result.replace(
            /^# (.*)$/gm,
            "<h3>$1</h3>"
        );


    return result;
}


/* =========================================================
   ২০. ESCAPE HTML
   ========================================================= */

function escapeHTML(
    text
) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;
}


/* =========================================================
   ২১. ERROR
   ========================================================= */

function addAIError(
    message
) {

    const box =
        document.createElement(
            "div"
        );

    box.className =
        "ai-error";

    box.textContent =
        "AI reply error: " +
        message;

    chatArea.appendChild(
        box
    );

    scrollToBottom();
}


/* =========================================================
   ২২. VOICE
   ========================================================= */

function startVoice() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        alert(
            "Voice input is not supported in this browser."
        );

        return;
    }


    const recognition =
        new SpeechRecognition();


    recognition.lang =
        "bn-BD";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    recognition.onresult =
        function (event) {

            input.value =
                event.results[0][0]
                    .transcript;


            input.dispatchEvent(
                new Event("input")
            );
        };


    recognition.onerror =
        function () {

            input.focus();
        };


    recognition.start();
}


/* =========================================================
   ২৩. SCROLL
   ========================================================= */

function scrollToBottom() {

    setTimeout(
        function () {

            chatArea.scrollTop =
                chatArea.scrollHeight;

        },
        50
    );
}

</script>

</body>
</html>
