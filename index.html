<!DOCTYPE html><html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PingMe AI</title><style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0f0f0f;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.app{
    width:100%;
    max-width:700px;
    height:100vh;
    margin:auto;
    display:flex;
    flex-direction:column;
    background:#111;
}

/* HEADER */

.header{
    height:60px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    border-bottom:1px solid #292929;
    background:#151515;
}

.logo{
    font-size:20px;
    font-weight:bold;
    color:#00ff88;
}

.language{
    background:#252525;
    color:white;
    border:0;
    border-radius:8px;
    padding:8px 10px;
}

/* CHAT */

.chat{
    flex:1;
    overflow-y:auto;
    padding:20px 15px 130px;
}

.message{
    max-width:85%;
    padding:13px 16px;
    margin:12px 0;
    border-radius:18px;
    line-height:1.55;
    font-size:16px;
    word-wrap:break-word;
}

.ai{
    background:#202020;
    margin-right:auto;
    border-bottom-left-radius:5px;
}

.user{
    background:#00a86b;
    margin-left:auto;
    border-bottom-right-radius:5px;
}

/* BOTTOM */

.bottom{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    max-width:700px;
    margin:auto;
    background:#111;
    padding:10px 12px 15px;
    border-top:1px solid #292929;
}

.input-box{
    display:flex;
    align-items:center;
    gap:7px;
    background:#222;
    border:1px solid #333;
    border-radius:24px;
    padding:6px 7px;
}

.icon{
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:transparent;
    color:#ddd;
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

.icon:hover{
    background:#333;
}

#messageInput{
    flex:1;
    background:transparent;
    border:0;
    outline:none;
    color:white;
    font-size:16px;
    min-width:0;
    padding:9px 4px;
}

#messageInput::placeholder{
    color:#888;
}

.send{
    background:#00ff88;
    color:#000;
}

.send:hover{
    background:#00d875;
}

.small-text{
    text-align:center;
    color:#666;
    font-size:11px;
    margin-top:7px;
}

/* MOBILE */

@media(max-width:500px){

    .header{
        height:55px;
    }

    .chat{
        padding:15px 10px 130px;
    }

    .message{
        max-width:88%;
        font-size:15px;
    }

    .icon{
        width:35px;
        height:35px;
        font-size:18px;
    }

}

</style></head><body><div class="app"><!-- HEADER -->

<div class="header">

    <div class="logo">
        PingMe AI
    </div>

    <select class="language" id="language">

        <option value="bn">
            বাংলা
        </option>

        <option value="en">
            English
        </option>

    </select>

</div>


<!-- CHAT -->

<div class="chat" id="chat">

    <div class="message ai">

        হ্যালো! 👋<br>
        আমি PingMe AI।<br><br>

        এখন এটা আমার প্রথম Chat Interface।
        পরে এখানে আসল AI যুক্ত করা হবে।

    </div>

</div>


<!-- MESSAGE BOX -->

<div class="bottom">

    <div class="input-box">

        <!-- ATTACHMENT -->

        <button
            class="icon"
            title="Attach"
            onclick="attachment()">
            ＋
        </button>


        <!-- CAMERA -->

        <button
            class="icon"
            title="Camera"
            onclick="camera()">
            📷
        </button>


        <!-- MICROPHONE -->

        <button
            class="icon"
            title="Voice"
            onclick="microphone()">
            🎤
        </button>


        <!-- INPUT -->

        <input
            id="messageInput"
            type="text"
            placeholder="মেসেজ লিখ..."
            autocomplete="off"
        >


        <!-- VOICE -->

        <button
            class="icon"
            title="Voice"
            onclick="voice()">
            🔊
        </button>


        <!-- SEND -->

        <button
            class="icon send"
            title="Send"
            onclick="sendMessage()">
            ➤
        </button>

    </div>


    <div class="small-text">
        PingMe AI
    </div>

</div>

</div><script>

/* SEND MESSAGE */

function sendMessage(){

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();

    if(!text) return;


    const chat =
        document.getElementById("chat");


    const userMessage =
        document.createElement("div");

    userMessage.className =
        "message user";

    userMessage.textContent =
        text;

    chat.appendChild(userMessage);


    input.value = "";

    chat.scrollTop =
        chat.scrollHeight;


    /*
       Temporary test response.
       পরে এখানে আসল AI বসবে।
    */

    setTimeout(function(){

        const aiMessage =
            document.createElement("div");

        aiMessage.className =
            "message ai";

        const language =
            document.getElementById("language").value;

        if(language === "bn"){

            aiMessage.textContent =
                "তোর মেসেজ পেয়েছি। 😊\n\nএখন এটা Test Mode। পরে এখানে আসল AI যুক্ত করা হবে।";

        }else{

            aiMessage.textContent =
                "I received your message. 😊\n\nThis is currently Test Mode. The real AI will be added later.";

        }

        chat.appendChild(aiMessage);

        chat.scrollTop =
            chat.scrollHeight;

    },500);

}


/* ENTER KEY */

document
.getElementById("messageInput")
.addEventListener("keydown",function(e){

    if(e.key === "Enter"){

        sendMessage();

    }

});


/* BUTTON TESTS */

function attachment(){

    alert(
        "Attachment feature will be added later."
    );

}

function camera(){

    alert(
        "Camera feature will be added later."
    );

}

function microphone(){

    alert(
        "Microphone feature will be added later."
    );

}

function voice(){

    alert(
        "Voice feature will be added later."
    );

}

</script></body>
</html>
