<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PingMe AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #0d0d0d;
    }

    body {
      overflow: hidden;
    }

    button,
    textarea {
      font-family: inherit;
    }

    button {
      border: none;
      background: none;
      cursor: pointer;
    }

    .app {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }

    /* =========================
       HEADER
       ========================= */

    .top-bar {
      height: 60px;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid #f4f4f4;
      background: #ffffff;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .premium-logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
    }

    .brand h1 {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      min-width: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: #212121;
      background: #ffffff;
      transition: background 0.15s;
    }

    .icon-btn:hover {
      background: #f4f4f6;
    }

    /* =========================
       CHAT AREA
       ========================= */

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      scroll-behavior: smooth;
      background: #ffffff;
    }

    .welcome-screen {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding-bottom: 40px;
    }

    .welcome-screen h2 {
      font-size: 30px;
      font-weight: 500;
      margin-bottom: 32px;
      color: #000000;
      letter-spacing: -0.5px;
    }

    .suggestions-list {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .suggestion-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      border: 1px solid #e3e3e3;
      border-radius: 20px;
      background: #ffffff;
      color: #424242;
      text-align: left;
      font-size: 14px;
      transition: background 0.2s, border-color 0.2s;
    }

    .suggestion-item:hover {
      background: #f9f9f9;
      border-color: #b4b4b4;
    }

    .suggestion-item .icon-svg {
      color: #1066e5;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .suggestion-item .text {
      flex: 1;
      font-weight: 400;
    }

    /* =========================
       CHAT MESSAGES
       ========================= */

    .message-row {
      width: 100%;
      display: flex;
      margin-bottom: 24px;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.ai {
      justify-content: flex-start;
    }

    .message-box {
      max-width: 85%;
    }

    .message {
      max-width: 100%;
      font-size: 16px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message-row.user .message {
      background: #f4f4f6;
      color: #0d0d0d;
      padding: 10px 16px;
      border-radius: 20px;
      border-bottom-right-radius: 5px;
    }

    .message-row.ai .message {
      background: transparent;
      color: #0d0d0d;
      padding: 0;
    }

    /* =========================
       THINKING
       ========================= */

    .thinking-message {
      padding: 0;
      background: transparent !important;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .thinking-spinner-svg {
      color: #1066e5;
      animation: pingmeSpin 1.1s linear infinite;
    }

    @keyframes pingmeSpin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .thinking-text {
      font-size: 14px;
      color: #6e6e73;
      font-weight: 500;
    }

    /* =========================
       MESSAGE ACTIONS
       ========================= */

    .message-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 12px;
      padding-left: 2px;
    }

    .message-action-btn {
      color: #b4b4b4;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .message-action-btn:hover {
      color: #212121;
    }

    /* =========================
       COMPOSER
       ========================= */

    .composer-wrapper {
      width: 100%;
      padding: 10px 16px 20px;
      background: #ffffff;
      border-top: 1px solid #f4f4f4;
    }

    .composer {
      width: 100%;
      min-height: 52px;
      display: flex;
      align-items: flex-end;
      gap: 4px;
      padding: 6px 8px;
      border: 1px solid #e3e3e3;
      border-radius: 28px;
      background: #ffffff;
    }

    #messageInput {
      flex: 1;
      width: 100%;
      min-height: 40px;
      max-height: 120px;
      padding: 9px 8px;
      border: none;
      outline: none;
      resize: none;
      background: transparent;
      color: #000000;
      font-size: 16px;
      line-height: 22px;
    }

    #messageInput::placeholder {
      color: #b4b4b4;
    }

    .send-btn {
      width: 34px;
      height: 34px;
      min-width: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #000000;
      color: #ffffff;
      transition: transform 0.1s, opacity 0.2s;
    }

    .send-btn:active {
      transform: scale(0.94);
    }

    .send-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* =========================
       ATTACHMENT MENU
       ========================= */

    .attachment-menu {
      width: 190px;
      margin-bottom: 8px;
      padding: 8px;
      border: 1px solid #eeeeee;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.09);
    }

    .attachment-menu[hidden] {
      display: none !important;
    }

    .attachment-menu button {
      width: 100%;
      padding: 10px;
      text-align: left;
      border-radius: 9px;
      color: #333333;
    }

    .attachment-menu button:hover {
      background: #f5f5f5;
    }

    .composer-note {
      padding-top: 8px;
      text-align: center;
      color: #999999;
      font-size: 11px;
    }

    @media (max-width: 480px) {
      .chat-area {
        padding-left: 16px;
        padding-right: 16px;
      }

      .message-box {
        max-width: 88%;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- =========================
       HEADER
       ========================= -->

  <header class="top-bar">

    <button class="icon-btn" id="menuBtn" type="button"
      aria-label="History">

      <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
        <path
          d="M4 8h16M4 16h16"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"/>
      </svg>

    </button>

    <div class="brand">
      <div class="premium-logo">P</div>
      <h1>PingMe AI</h1>
    </div>

    <button class="icon-btn" id="settingsBtn" type="button"
      aria-label="Settings">

      <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
        <path
          d="M12 12m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0
             M12 5m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0
             M12 19m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0"
          stroke="currentColor"
          stroke-width="2.5"/>
      </svg>

    </button>

  </header>

  <!-- =========================
       CHAT
       ========================= -->

  <main class="chat-area" id="chatArea">

    <section class="welcome-screen" id="welcomeScreen">

      <h2>What's on your mind?</h2>

      <div class="suggestions-list">

        <button type="button" class="suggestion-item">

          <span class="icon-svg">
            <svg viewBox="0 0 24 24"
              width="20" height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2">

              <path d="M19 14c1.66 0 3-1.34 3-3V5
                       c0-1.66-1.34-3-3-3H5
                       C3.34 2 2 3.34 2 5v6
                       c0 1.66 1.34 3 3 3h14z
                       M12 22v-4M8 22h8M6 8h12"/>

            </svg>
          </span>

          <span class="text">
            Prepare for a doctor visit
          </span>

        </button>

        <button type="button" class="suggestion-item">

          <span class="icon-svg">
            <svg viewBox="0 0 24 24"
              width="20" height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2">

              <path d="M3 9h18M3 15h18
                       M7 3v18M17 3v18"/>

            </svg>
          </span>

          <span class="text">
            Visualize new home decor
          </span>

        </button>

        <button type="button"
          class="suggestion-item"
          data-prompt="Create city cat art">

          <span class="icon-svg">

            <svg viewBox="0 0 24 24"
              width="20" height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round">

              <path d="M4 20l4.5-4.5
                       M15 4l5 5
                       M12 7l5 5
                       M7 12l5 5
                       M4 4l3 3
                       M17 17l3 3"/>

            </svg>

          </span>

          <span class="text">
            Create city cat art
          </span>

        </button>

      </div>

    </section>

  </main>

  <!-- =========================
       COMPOSER
       ========================= -->

  <div class="composer-wrapper">

    <div
      class="attachment-menu"
      id="attachmentMenu"
      hidden>

      <button type="button">Camera</button>
      <button type="button">Photo</button>
      <button type="button">File</button>
      <button type="button">Audio</button>
      <button type="button">Screen</button>
      <button type="button">Project</button>

    </div>

    <div class="composer">

      <button
        class="icon-btn"
        id="plusBtn"
        type="button"
        aria-label="Attach">

        <svg viewBox="0 0 24 24"
          width="21" height="21"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round">

          <path d="M12 5v14M5 12h14"/>

        </svg>

      </button>

      <textarea
        id="messageInput"
        rows="1"
        placeholder="Message PingMe AI..."
        aria-label="Message"></textarea>

      <button
        class="icon-btn"
        id="micBtn"
        type="button"
        aria-label="Voice input">

        <svg viewBox="0 0 24 24"
          width="20" height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round">

          <rect x="9" y="2" width="6" height="13" rx="3"/>
          <path d="M5 11a7 7 0 0 0 14 0"/>
          <path d="M12 18v4M8 22h8"/>

        </svg>

      </button>

      <button
        class="send-btn"
        id="sendBtn"
        type="button"
        aria-label="Send"
        disabled>

        <svg viewBox="0 0 24 24"
          width="17" height="17"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round">

          <path d="M12 19V5"/>
          <path d="M6 11l6-6 6 6"/>

        </svg>

      </button>

    </div>

    <div class="composer-note">
      PingMe AI can make mistakes. Check important information.
    </div>

  </div>

</div>

<!-- ==========================================================
     FIREBASE + FIREBASE AI LOGIC
     Official Firebase browser CDN modules
     ========================================================== -->

<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  import {
    getAI,
    getGenerativeModel,
    GoogleAIBackend
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-ai.js";


  /* ==========================================================
     FIREBASE CONFIGURATION
     ========================================================== */

  const firebaseConfig = {

    /*
      IMPORTANT:
      এখানে নতুন/নিরাপদ API key বসাবি।

      তুই যে key আগে এখানে পাঠিয়েছিস সেটা ব্যবহার করিস না।
    */

    apiKey: "AIzaSyB4dAUhxEao415YdVg4l4WYJ21hQ9V-tyk",

    authDomain: "pingme-ai-8d8cc.firebaseapp.com",

    projectId: "pingme-ai-8d8cc",

    storageBucket: "pingme-ai-8d8cc.firebasestorage.app",

    messagingSenderId: "547217020747",

    appId: "1:547217020747:web:62b7d3843672703d8abace",

    measurementId: "G-3WRC64CRDR"
  };


  /* ==========================================================
     INITIALIZE FIREBASE
     ========================================================== */

  const firebaseApp = initializeApp(firebaseConfig);

  const ai = getAI(firebaseApp, {
    backend: new GoogleAIBackend()
  });


  /* ==========================================================
     PINGME AI SYSTEM INSTRUCTION
     ========================================================== */

  const PINGME_AI_PROMPT = {

    systemInstruction:
      "Your name is PingMe AI. " +
      "You are a helpful AI assistant. " +
      "Never say that your name is Gemini. " +
      "Never introduce yourself as Google Gemini. " +
      "If anyone asks your name, reply exactly: " +
      "'My name is PingMe AI'."
  };


  /* ==========================================================
     THREE GEMINI MODELS
     ========================================================== */

  const models = [

    getGenerativeModel(ai, {
      model: "gemini-3.7-flash",
      config: PINGME_AI_PROMPT
    }),

    getGenerativeModel(ai, {
      model: "gemini-3.6-flash",
      config: PINGME_AI_PROMPT
    }),

    getGenerativeModel(ai, {
      model: "gemini-3.5-flash-lite",
      config: PINGME_AI_PROMPT
    })

  ];


  /* ==========================================================
     OPTIONAL GLOBAL INSTRUCTION
     ========================================================== */

  const PINGME_AI_INSTRUCTION =
    window.PINGME_AI_INSTRUCTION || "";


  /* ==========================================================
     ELEMENT CONNECTIONS
     ========================================================== */

  const chatArea =
    document.getElementById("chatArea");

  const welcomeScreen =
    document.getElementById("welcomeScreen");

  const messageInput =
    document.getElementById("messageInput");

  const sendBtn =
    document.getElementById("sendBtn");

  const plusBtn =
    document.getElementById("plusBtn");

  const micBtn =
    document.getElementById("micBtn");

  const menuBtn =
    document.getElementById("menuBtn");

  const settingsBtn =
    document.getElementById("settingsBtn");

  const attachmentMenu =
    document.getElementById("attachmentMenu");


  /* ==========================================================
     ADD MESSAGE
     ========================================================== */

  window.addMessage = function(text, sender) {

    if (welcomeScreen) {
      welcomeScreen.style.display = "none";
    }

    const row =
      document.createElement("div");

    row.className =
      sender === "user"
        ? "message-row user"
        : "message-row ai";

    const box =
      document.createElement("div");

    box.className = "message-box";

    const message =
      document.createElement("div");

    message.className = "message";

    message.textContent = text;

    box.appendChild(message);


    /* =========================
       AI ACTION BUTTONS
       ========================= */

    if (sender === "ai") {

      const actions =
        document.createElement("div");

      actions.className =
        "message-actions";


      /* COPY BUTTON */

      const copyBtn =
        document.createElement("button");

      copyBtn.type = "button";

      copyBtn.className =
        "message-action-btn";

      copyBtn.innerHTML = `
        <svg viewBox="0 0 24 24"
          width="16" height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round">

          <rect x="9" y="9"
            width="13" height="13"
            rx="2"></rect>

          <path d="M5 15H4a2 2 0 0 1-2-2V4
                   a2 2 0 0 1 2-2h9
                   a2 2 0 0 1 2 2v1"></path>

        </svg>
      `;

      copyBtn.title = "Copy Text";

      copyBtn.addEventListener(
        "click",
        async () => {

          try {

            await navigator.clipboard
              .writeText(text);

            copyBtn.style.color =
              "#1066e5";

            setTimeout(() => {

              copyBtn.style.color =
                "#b4b4b4";

            }, 1500);

          } catch (error) {

            console.log(
              "Copy failed",
              error
            );

          }

        }
      );


      /* LINK BUTTON */

      const linkBtn =
        document.createElement("button");

      linkBtn.type = "button";

      linkBtn.className =
        "message-action-btn";

      linkBtn.innerHTML = `
        <svg viewBox="0 0 24 24"
          width="16" height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round">

          <path d="M10 13a5 5 0 0 0 7.54.54l3-3
                   a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>

          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3
                   a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>

        </svg>
      `;

      linkBtn.title = "Copy Link";

      linkBtn.addEventListener(
        "click",
        async () => {

          const match =
            text.match(
              /https?:\/\/[^\s]+/i
            );

          if (!match) {
            return;
          }

          try {

            await navigator.clipboard
              .writeText(match[0]);

            linkBtn.style.color =
              "#1066e5";

            setTimeout(() => {

              linkBtn.style.color =
                "#b4b4b4";

            }, 1500);

          } catch (error) {

            console.log(
              "Link copy failed",
              error
            );

          }

        }
      );


      actions.appendChild(copyBtn);
      actions.appendChild(linkBtn);

      box.appendChild(actions);
    }


    row.appendChild(box);

    chatArea.appendChild(row);

    chatArea.scrollTop =
      chatArea.scrollHeight;

    return row;
  };


  /* ==========================================================
     THINKING MESSAGE
     ========================================================== */

  window.addThinkingMessage = function() {

    if (welcomeScreen) {
      welcomeScreen.style.display = "none";
    }

    const row =
      document.createElement("div");

    row.className =
      "message-row ai";

    const message =
      document.createElement("div");

    message.className =
      "message thinking-message";

    const spinner =
      document.createElement("div");

    spinner.className =
      "thinking-spinner-svg";

    spinner.innerHTML = `
      <svg viewBox="0 0 24 24"
        width="22" height="22"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round">

        <path d="M12 2v4"/>
        <path d="M12 18v4"/>
        <path d="M4.93 4.93l2.83 2.83"/>
        <path d="M16.24 16.24l2.83 2.83"/>
        <path d="M2 12h4"/>
        <path d="M18 12h4"/>
        <path d="M4.93 19.07l2.83-2.83"/>
        <path d="M16.24 7.76l2.83-2.83"/>

      </svg>
    `;

    const textSpan =
      document.createElement("span");

    textSpan.className =
      "thinking-text";

    textSpan.textContent =
      "Thinking...";

    message.appendChild(spinner);
    message.appendChild(textSpan);

    row.appendChild(message);

    chatArea.appendChild(row);

    chatArea.scrollTop =
      chatArea.scrollHeight;

    return row;
  };


  /* ==========================================================
     GENERATE AI RESPONSE
     ========================================================== */

  window.generateAIResponse =
    async function(userText) {

      const prompt =
        PINGME_AI_INSTRUCTION +
        "\n\nUSER MESSAGE:\n" +
        userText;

      let lastError = null;


      /*
        Try model 1.
        If it fails, automatically try model 2.
        If model 2 fails, try model 3.
      */

      for (const model of models) {

        try {

          const result =
            await model.generateContent(prompt);

          const response =
            result.response;

          const answer =
            response.text();

          if (
            answer &&
            answer.trim()
          ) {

            return answer.trim();

          }

        } catch (error) {

          lastError = error;

          console.error(
            "PingMe model failed:",
            error
          );

        }

      }

      throw (
        lastError ||
        new Error("ALL_MODELS_FAILED")
      );
    };


  /* ==========================================================
     SEND MESSAGE
     ========================================================== */

  async function sendMessage() {

    const userText =
      messageInput.value.trim();

    if (!userText) {
      return;
    }

    addUserMessage(userText);

    messageInput.value = "";

    autoResize();

    sendBtn.disabled = true;

    const thinkingRow =
      window.addThinkingMessage();


    try {

      const answer =
        await window.generateAIResponse(
          userText
        );

      thinkingRow.remove();

      window.addMessage(
        answer,
        "ai"
      );

    } catch (error) {

      console.error(error);

      thinkingRow.remove();

      window.addMessage(
        "Sorry, I couldn't connect to the AI right now. Please check your Firebase/API configuration and try again.",
        "ai"
      );

    } finally {

      updateSendButton();

    }
  }


  /* ==========================================================
     USER MESSAGE
     ========================================================== */

  function addUserMessage(text) {

    window.addMessage(
      text,
      "user"
    );

  }


  /* ==========================================================
     SEND BUTTON STATE
     ========================================================== */

  function updateSendButton() {

    const hasText =
      messageInput.value.trim().length > 0;

    sendBtn.disabled =
      !hasText;
  }


  /* ==========================================================
     TEXTAREA AUTO RESIZE
     ========================================================== */

  function autoResize() {

    messageInput.style.height =
      "auto";

    messageInput.style.height =
      Math.min(
        messageInput.scrollHeight,
        120
      ) + "px";

  }


  /* ==========================================================
     INPUT EVENTS
     ========================================================== */

  messageInput.addEventListener(
    "input",
    () => {

      autoResize();

      updateSendButton();

    }
  );


  messageInput.addEventListener(
    "keydown",
    (event) => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


  sendBtn.addEventListener(
    "click",
    sendMessage
  );


  /* ==========================================================
     ATTACHMENT MENU
     ========================================================== */

  plusBtn.addEventListener(
    "click",
    () => {

      attachmentMenu.hidden =
        !attachmentMenu.hidden;

    }
  );


  /* ==========================================================
     SUGGESTION BUTTONS
     ========================================================== */

  document
    .querySelectorAll(".suggestion-item")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const prompt =
            button.dataset.prompt ||
            button.querySelector(".text")
              ?.textContent
              .trim();

          if (!prompt) {
            return;
          }

          messageInput.value =
            prompt;

          autoResize();

          updateSendButton();

          sendMessage();

        }
      );

    });


  /* ==========================================================
     MENU BUTTON
     ========================================================== */

  menuBtn.addEventListener(
    "click",
    () => {

      window.addMessage(
        "History feature is ready to be connected.",
        "ai"
      );

    }
  );


  /* ==========================================================
     SETTINGS BUTTON
     ========================================================== */

  settingsBtn.addEventListener(
    "click",
    () => {

      window.addMessage(
        "Settings panel is ready to be connected.",
        "ai"
      );

    }
  );


  /* ==========================================================
     MIC BUTTON
     ========================================================== */

  micBtn.addEventListener(
    "click",
    () => {

      if (
        !("webkitSpeechRecognition" in window) &&
        !("SpeechRecognition" in window)
      ) {

        window.addMessage(
          "Voice input is not supported in this browser.",
          "ai"
        );

        return;
      }


      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      const recognition =
        new SpeechRecognition();

      recognition.lang =
        "en-US";

      recognition.interimResults =
        false;

      recognition.maxAlternatives =
        1;


      recognition.onresult =
        event => {

          const transcript =
            event.results[0][0].transcript;

          messageInput.value =
            transcript;

          autoResize();

          updateSendButton();

        };


      recognition.onerror =
        error => {

          console.error(
            "Speech recognition error:",
            error
          );

        };


      recognition.start();

    }
  );


  /* ==========================================================
     STARTUP
     ========================================================== */

  updateSendButton();

</script>

</body>
</html>
