<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Perfect Dynamic Pop-up Input Bar</title>
    <!-- Google Fonts for Clean UI -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f7f9fc;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 100vh;
            overflow: hidden;
        }

        /* Full Screen Wrapper for Live GitHub Preview */
        .app-live-canvas {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background: #ffffff;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Dummy Chat Content Space to push content up */
        .chat-space-filler {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        /* ========================================================
           MAIN MASTER INPUT SYSTEM (LOCKED TO BOTTOM ALWAYS)
           ======================================================== */
        .bottom-fixed-system {
            position: fixed;
            bottom: 16px; /* স্ক্রিনের একদম নিচের বর্ডার থেকে পারফেক্ট গ্যাপ */
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 418px; /* App Container এর সাপেক্ষে মার্জিন ফিক্সড */
            background: #ffffff;
            border: 1px solid #e5e5ea;
            border-radius: 30px; /* শুরুতে গোল চিকন ক্যাপসুল */
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 0; /* শুরুতে ভেতরের গ্যাপ থাকবে না */
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 999;
        }

        /* --- ROW 1: THE TEXT INPUT FIELD --- */
        .input-text-container {
            width: 100%;
            display: flex;
            align-items: center;
        }

        .main-chat-input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 16px;
            color: #0d0d0d;
            outline: none;
            padding: 4px 0;
        }

        .main-chat-input::placeholder {
            color: #757575;
        }

        /* --- ROW 2: CONTROL BUTTONS (HIDDEN BY DEFAULT) --- */
        .input-control-buttons-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            opacity: 0;
            visibility: hidden;
            height: 0; /* শুরুতে হাইট এবং স্পেস শূন্য থাকবে */
            overflow: hidden;
            transition: all 0.2s ease;
        }

        /* --- DYNAMIC TRANSITION CLASSES (ক্লিক করলে এই স্টাইলগুলো অ্যাক্টিভ হবে) --- */
        .bottom-fixed-system.expanded-popup {
            border-radius: 24px; /* চারকোনা পপ-আপ কার্ড শেপ */
            padding: 16px 20px 14px 20px;
            gap: 16px; /* রো দুটির মাঝে পারফেক্ট দূরত্ব তৈরি হবে */
        }

        .bottom-fixed-system.expanded-popup .input-control-buttons-row {
            opacity: 1;
            visibility: visible;
            height: 44px; /* বাটন রোটি সুন্দরভাবে পপ-আপ হয়ে ভেসে উঠবে */
        }

        /* --- BUTTONS STYLING --- */
        .left-icon-bundle {
            display: flex;
            align-items: center;
            gap: 40px; /* আপনার স্ক্রিনশটের আইকনগুলোর মধ্যকার গ্যাপ */
        }

        .plus-gray-action-btn {
            width: 44px;
            height: 44px;
            background-color: #f1f3f8;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            color: #0d0d0d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 300;
            cursor: pointer;
        }

        .utility-svg-btn {
            background: none;
            border: none;
            color: #0d0d0d;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Dynamic Arrow Button States */
        .arrow-submit-circle-btn {
            width: 48px;
            height: 44px;
            background-color: #dbe4ff; /* নিষ্ক্রিয় হালকা নীল (ছবি ১) */
            color: #ffffff;
            border: none;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        /* টাইপ করলে সক্রিয় উজ্জ্বল নীল রঙ (ছবি ৩) */
        .arrow-submit-circle-btn.typing-active {
            background-color: #1a73e8;
        }

        .icon-vertical-align {
            display: inline-block;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <div class="app-live-canvas">
        
        <!-- চ্যাট এরিয়া (ইনপুট বক্সকে পুশ করে নিচে রাখার জন্য) -->
        <div class="chat-space-filler" id="chatSpace"></div>

        <!-- ========================================================
             ১টি একক ফাইলে ৩টি মোড সামলানোর ইন্টেলিজেন্ট ইনপুট সিস্টেম
             ======================================================== -->
        <div class="bottom-fixed-system" id="inputSystemMaster">
            
            <!-- লাইন ১: টাইপিং টেক্সট বক্স -->
            <div class="input-text-container">
                <input type="text" class="main-chat-input" id="chatInputField" placeholder="Ask anything">
            </div>
            
            <!-- লাইন ২: কন্ট্রোল বাটন রো (শুরুতে হাইড থাকবে, ফোকাস করলে পপ-আপ হবে) -->
            <div class="input-control-buttons-row">
                <div class="left-icon-bundle">
                    <!-- প্লাস বাটন -->
                    <button class="plus-gray-action-btn">+</button>
                    
                    <!-- মাইক আইকন -->
                    <button class="utility-svg-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                            <path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
                            <line x1="12" y1="19" x2="12" y2="22"></line>
                        </svg>
                    </button>
                    
                    <!-- ক্যামেরা আইকন -->
                    <button class="utility-svg-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                            <circle cx="12" cy="13" r="4"></circle>
                        </svg>
                    </button>
                </div>

                <!-- ডান পাশের এরো বাটন -->
                <button class="arrow-submit-circle-btn" id="arrowSubmitBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="19" x2="12" y2="5"></line>
                        <polyline points="5 12 12 5 19 12"></polyline>
                    </svg>
                </button>
            </div>

        </div>

    </div>

    <script>
        const chatInputField = document.getElementById('chatInputField');
        const inputSystemMaster = document.getElementById('inputSystemMaster');
        const arrowSubmitBtn = document.getElementById('arrowSubmitBtn');
        const chatSpace = document.getElementById('chatSpace');

        // --- THREE MODELS HERE ---
        const CORE_AI_ENGINES = { m1: "GPT Core", m2: "Gemini Engine", m3: "Claude Core" };
        let selectedEngine = CORE_AI_ENGINES.m2;

        // --- API KEY HERE ---
        const SECRET_PASSPHRASE_KEY = "PLACE_YOUR_API_KEY_HERE";

        // লজিক ১: বক্সে ক্লিক (Focus) করলে এটি রূপ ২-এর মতো ওপরের দিকে পপ-আপ হয়ে বড় হবে
        chatInputField.addEventListener('focus', () => {
            inputSystemMaster.classList.add('expanded-popup');
        });

        // লজিক ২: টাইপ করা শুরু করলে বাটনটি রূপ ৩-এর মতো উজ্জ্বল নীল রঙে রূপ নেবে
        chatInputField.addEventListener('input', () => {
            if (chatInputField.value.trim() !== "") {
                arrowSubmitBtn.classList.add('typing-active');
            } else {
                arrowSubmitBtn.classList.remove('typing-active');
            }
        });

        // লজিক ৩: বক্সের বাইরে কোথাও ক্লিক করলে এবং বক্স খালি থাকলে এটি আবার ছোট ক্যাপসুল হয়ে যাবে
        document.addEventListener('click', (e) => {
            if (!inputSystemMaster.contains(e.target) && chatInputField.value.trim() === "") {
                inputSystemMaster.classList.remove('expanded-popup');
            }
        });
    </script>
</body>
</html>
