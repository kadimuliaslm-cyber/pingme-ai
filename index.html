<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>100% Fixed Chat Input System</title>
    <!-- App Mode Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- CSS File Link -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- চ্যাট/মেসেজ ডিসপ্লে এরিয়া (Flexbox সাপোর্ট সহ) -->
    <div class="chat-space-viewport" id="chatViewport" style="display: flex; flex-direction: column; gap: 16px;">
        <!-- এখানে ডায়নামিকালি মেসেজ বাবল যুক্ত হবে -->
    </div>

    <!-- স্ক্রিনের নিচে লকড থাকা ইনপুট প্যানেল এরিয়া -->
    <div class="input-panel-wrapper">
        
        <!-- মূল ডায়নামিক উইজেট কার্ড -->
        <div class="bottom-master-widget" id="mainWidgetCard">
            
            <!-- লাইন ১: টাইপিং ইনপুট ফিল্ড -->
            <div class="text-field-container">
                <input type="text" class="chat-main-input" id="chatInputField" placeholder="Ask anything" autocomplete="off">
            </div>
            
            <!-- লাইন ২: কন্ট্রোল বাটন রো -->
            <div class="icons-action-control-row">
                <div class="left-icon-utilities-group">
                    <!-- প্লাস বাটন -->
                    <button class="plus-action-gray-circle" type="button">+</button>
                    
                    <!-- মাইক আইকন -->
                    <button class="utility-svg-action-trigger" type="button">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                            <path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
                            <line x1="12" y1="19" x2="12" y2="22"></line>
                        </svg>
                    </button>
                    
                    <!-- ক্যামেরা আইকন -->
                    <button class="utility-svg-action-trigger" type="button">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                            <circle cx="12" cy="13" r="4"></circle>
                        </svg>
                    </button>
                </div>

                <!-- ডান পাশের এরো বাটন -->
                <button class="arrow-submit-circle-btn" id="arrowSubmitBtn" type="button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="19" x2="12" y2="5"></line>
                        <polyline points="5 12 12 5 19 12"></polyline>
                    </svg>
                </button>
            </div>

        </div>

    </div>

    <!-- গিটহাব লোডিং সিকোয়েন্স ঠিক রাখার জন্য স্ক্রিপ্ট ট্যাগগুলোর সঠিক বিন্যাস -->
    <script src="settings.js"></script>
    <script src="input.js"></script>
    <script src="app.js"></script>
</body>
</html>
