
<!DOCTYPE html><html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PingMe AI</title><style>
body{
    margin:0;
    background:#101010;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.box{
    width:90%;
    max-width:500px;
    background:#181818;
    padding:25px;
    border-radius:20px;
    text-align:center;
}

h1{
    color:#00ff88;
}

textarea{
    width:100%;
    height:120px;
    box-sizing:border-box;
    background:#252525;
    color:white;
    border:1px solid #444;
    border-radius:12px;
    padding:15px;
    font-size:17px;
    resize:none;
}

select,button{
    width:100%;
    margin-top:12px;
    padding:14px;
    border:0;
    border-radius:12px;
    font-size:16px;
}

select{
    background:#252525;
    color:white;
}

button{
    background:#00ff88;
    color:#000;
    font-weight:bold;
}

.stop{
    background:#333;
    color:white;
}

#status{
    margin-top:15px;
    color:#aaa;
    font-size:14px;
}
</style></head><body><div class="box"><h1>PingMe AI</h1>

<textarea id="text" placeholder="এখানে বাংলা অথবা English লিখ..."></textarea>

<select id="lang">
    <option value="bn-BD">বাংলা</option>
    <option value="en-US">English</option>
</select>

<button onclick="speak()">🔊 কথা বলাও</button>

<button class="stop" onclick="stopVoice()">⏹ বন্ধ</button>

<div id="status">Ready</div>

</div><script>

function speak(){

    const text =
        document.getElementById("text").value.trim();

    const lang =
        document.getElementById("lang").value;

    if(!text){
        document.getElementById("status").innerText =
            "আগে কিছু লিখ।";
        return;
    }

    if(!("speechSynthesis" in window)){
        document.getElementById("status").innerText =
            "এই ব্রাউজারে Voice Support নেই।";
        return;
    }

    speechSynthesis.cancel();

    const voice =
        new SpeechSynthesisUtterance(text);

    voice.lang = lang;

    voice.rate = 0.9;

    voice.pitch = 1;

    voice.volume = 1;

    speechSynthesis.speak(voice);

    document.getElementById("status").innerText =
        lang === "bn-BD"
        ? "বাংলায় বলছি..."
        : "Speaking English...";

    voice.onend = function(){

        document.getElementById("status").innerText =
            "Ready";

    };

}

function stopVoice(){

    if("speechSynthesis" in window){

        speechSynthesis.cancel();

        document.getElementById("status").innerText =
            "Voice stopped";

    }

}

</script></body>
</html>
