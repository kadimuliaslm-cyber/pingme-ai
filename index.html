<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no"
    >

    <title>PingMe AI Chat System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .chat-space-viewport {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
        }

        .welcome-screen {
            width: 100%;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 10px 30px;
        }

        .welcome-title {
            font-size: 28px;
            font-weight: 600;
            color: #111111;
            text-align: center;
            margin-bottom: 8px;
        }

        .welcome-subtitle {
            font-size: 14px;
            color: #777777;
            text-align: center;
            line-height: 1.5;
            max-width: 330px;
            margin-bottom: 24px;
        }

        .feature-list {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .feature-item {
            width: 100%;
            height: 44px;
            padding: 0 13px;
            border: 1px solid #e5e5ea;
            border-radius: 12px;
            background: #ffffff;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .feature-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            margin-right: 10px;
        }

        .feature-text {
            flex: 1;
            font-size: 14px;
            color: #202124;
        }

        .feature-arrow {
            font-size: 20px;
            color: #8a8a8a;
            line-height: 1;
        }

        .input-panel-wrapper {
            width: 100%;
            background: #ffffff;
            padding: 12px 16px 16px;
            flex-shrink: 0;
            border-top: 1px solid #f1f3f4;
        }

        .bottom-master-widget {
            width: 100%;
            background: #ffffff;
            border: 1px solid #e5e5ea;
            border-radius: 30px;
            padding: 12px 18px;
            display: flex;
            flex-direction: column;
            gap: 0;
            box-shadow: 0 2px 12px rgba(0,0,0,0.03);
            transition: all 0.22s ease;
        }

        .text-field-container {
            width: 100%;
            display: flex;
            align-items: center;
        }

        .chat-main-input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 16px;
            color: #0d0d0d;
            outline: none;
            padding: 4px 0;
        }

        .chat-main-input::placeholder {
            color: #757575;
        }

        .model-selector {
            width: 100%;
            margin-bottom: 10px;
            display: none;
        }

        .model-selector.visible {
            display: block;
        }

        .model-select {
            width: 100%;
            border: 1px solid #e5e5ea;
            background: #ffffff;
            color: #0d0d0d;
            border-radius: 14px;
            padding: 10px 12px;
            font-size: 14px;
            outline: none;
        }

        .icons-action-control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            opacity: 0;
            visibility: hidden;
            height: 0;
            overflow: hidden;
            transition: all 0.15s ease;
        }

        .bottom-master-widget.popup-expanded-card {
            border-radius: 24px;
            padding: 16px 20px 14px;
            gap: 14px;
        }

        .bottom-master-widget.popup-expanded-card
        .icons-action-control-row {
            opacity: 1;
            visibility: visible;
            height: 44px;
        }

        .left-icon-utilities-group {
            display: flex;
            align-items: center;
            gap: 36px;
        }

        .plus-action-gray-circle {
            width: 44px;
            height: 44px;
            background-color: #f1f3f8;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            color: #0d0d0d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 300;
            cursor: pointer;
        }

        .utility-svg-action-trigger {
            background: none;
            border: none;
            color: #0d0d0d;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
        }

        .arrow-submit-circle-btn {
            width: 48px;
            height: 44px;
            background-color: #dbe4ff;
            color: #ffffff;
            border: none;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .arrow-submit-circle-btn.typing-active-blue {
            background-color: #1a73e8;
        }

        @media (max-width: 480px) {

            .welcome-title {
                font-size: 26px;
            }

            .welcome-subtitle {
                font-size: 13px;
                margin-bottom: 20px;
            }

            .feature-list {
                max-width: 350px;
            }

            .feature-item {
                height: 42px;
            }
        }

    </style>
</head>

<body>

    <div
        class="chat-space-viewport"
        id="chatViewport"
    >

        <div
            class="welcome-screen"
            id="welcomeScreen"
        >

            <div class="welcome-title">
                What can I help you with?
            </div>

            <div class="welcome-subtitle">
                Ask anything, explore ideas, learn something new,
                or get help with your work.
            </div>

            <div class="feature-list">

                <div class="feature-item">
                    <span class="feature-icon">✨</span>
                    <span class="feature-text">
                        Create something
                    </span>
                    <span class="feature-arrow">›</span>
                </div>

                <div class="feature-item">
                    <span class="feature-icon">📚</span>
                    <span class="feature-text">
                        Learn something
                    </span>
                    <span class="feature-arrow">›</span>
                </div>

                <div class="feature-item">
                    <span class="feature-icon">💡</span>
                    <span class="feature-text">
                        Get ideas
                    </span>
                    <span class="feature-arrow">›</span>
                </div>

                <div class="feature-item">
                    <span class="feature-icon">💻</span>
                    <span class="feature-text">
                        Help with coding
                    </span>
                    <span class="feature-arrow">›</span>
                </div>

            </div>

        </div>

    </div>

    <div class="input-panel-wrapper">

        <div
            class="bottom-master-widget"
            id="mainWidgetCard"
        >

            <div
                class="model-selector"
                id="modelSelectorBox"
            >

                <select
                    class="model-select"
                    id="modelSelect"
                >

                    <option value="gemini-3.8-flash">
                        Gemini 3.8 Flash
                    </option>

                    <option value="gemini-3.7-flash">
                        Gemini 3.7 Flash
                    </option>

                    <option value="gemini-3.6-flash">
                        Gemini 3.6 Flash
                    </option>

                </select>

            </div>

            <div class="text-field-container">

                <input
                    type="text"
                    class="chat-main-input"
                    id="chatInputField"
                    placeholder="Ask anything"
                    autocomplete="off"
                >

            </div>

            <div class="icons-action-control-row">

                <div class="left-icon-utilities-group">

                    <button
                        class="plus-action-gray-circle"
                        type="button"
                        id="plusButton"
                    >
                        +
                    </button>

                    <button
                        class="utility-svg-action-trigger"
                        type="button"
                    >

                        <svg
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <path
                                d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"
                            ></path>

                            <path
                                d="M19 10v1a7 7 0 0 1-14 0v-1"
                            ></path>

                            <line
                                x1="12"
                                y1="19"
                                x2="12"
                                y2="22"
                            ></line>

                        </svg>

                    </button>

                    <button
                        class="utility-svg-action-trigger"
                        type="button"
                    >

                        <svg
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <path
                                d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
                            ></path>

                            <circle
                                cx="12"
                                cy="13"
                                r="4"
                            ></circle>

                        </svg>

                    </button>

                </div>

                <button
                    class="arrow-submit-circle-btn"
                    id="arrowSubmitBtn"
                    type="button"
                >

                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <line
                            x1="12"
                            y1="19"
                            x2="12"
                            y2="5"
                        ></line>

                        <polyline
                            points="5 12 12 5 19 12"
                        ></polyline>

                    </svg>

                </button>

            </div>

        </div>

    </div>


    <script>

        /* =====================================
           GEMINI API KEY
           ===================================== */

        const GEMINI_API_KEY =
            "AIzaSyB4dAUhxEao415YdVg4l4WYJ21hQ9V-tyk";


        /* =====================================
           MAIN ELEMENTS
           ===================================== */

        const chatInputField =
            document.getElementById("chatInputField");

        const mainWidgetCard =
            document.getElementById("mainWidgetCard");

        const arrowSubmitBtn =
            document.getElementById("arrowSubmitBtn");

        const modelSelectorBox =
            document.getElementById("modelSelectorBox");

        const plusButton =
            document.getElementById("plusButton");


        /* INPUT FOCUS */

        chatInputField.addEventListener(
            "focus",
            () => {

                mainWidgetCard.classList.add(
                    "popup-expanded-card"
                );

                modelSelectorBox.classList.add(
                    "visible"
                );

            }
        );


        /* INPUT TYPING */

        chatInputField.addEventListener(
            "input",
            () => {

                if (
                    chatInputField.value.trim() !== ""
                ) {

                    arrowSubmitBtn.classList.add(
                        "typing-active-blue"
                    );

                } else {

                    arrowSubmitBtn.classList.remove(
                        "typing-active-blue"
                    );

                }

            }
        );


        /* CLICK OUTSIDE */

        document.addEventListener(
            "click",
            (e) => {

                if (
                    !mainWidgetCard.contains(e.target) &&
                    chatInputField.value.trim() === ""
                ) {

                    mainWidgetCard.classList.remove(
                        "popup-expanded-card"
                    );

                    modelSelectorBox.classList.remove(
                        "visible"
                    );

                }

            }
        );


        /* PLUS BUTTON */

        plusButton.addEventListener(
            "click",
            () => {

                mainWidgetCard.classList.toggle(
                    "popup-expanded-card"
                );

                modelSelectorBox.classList.toggle(
                    "visible"
                );

            }
        );


        /* =====================================
           SEND MESSAGE
        ===================================== */

        arrowSubmitBtn.addEventListener(
            "click",
            () => {

                const message =
                    chatInputField.value.trim();

                if (message === "") {
                    return;
                }


                const messageBox =
                    document.createElement("div");


                messageBox.textContent =
                    message;


                messageBox.style.cssText = `
                    align-self: flex-end;
                    max-width: 80%;
                    margin: 8px 0;
                    padding: 10px 14px;
                    background: #1a73e8;
                    color: #ffffff;
                    border-radius: 18px;
                    font-size: 15px;
                    line-height: 1.4;
                    word-wrap: break-word;
                `;


                document
                    .getElementById("chatViewport")
                    .appendChild(messageBox);


                chatInputField.value = "";


                arrowSubmitBtn.classList.remove(
                    "typing-active-blue"
                );


                const chatViewport =
                    document.getElementById(
                        "chatViewport"
                    );


                chatViewport.scrollTop =
                    chatViewport.scrollHeight;

            }
        );

    </script>

</body>
</html>
