<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PingMe AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- ================= HEADER ================= -->

    <header class="top-bar">

      <!-- HISTORY -->
      <button
        class="icon-btn"
        id="menuBtn"
        type="button"
        aria-label="History"
      >
        <svg
          viewBox="0 0 24 24"
          width="22"
          height="22"
          fill="none"
        >
          <path
            d="M4 7h16M4 12h16M4 17h10"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </button>


      <!-- BRAND -->

      <div class="brand">
        <h1>PingMe AI</h1>
      </div>


      <!-- SETTINGS -->

      <button
        class="icon-btn"
        id="settingsBtn"
        type="button"
        aria-label="Settings"
      >
        <svg
          viewBox="0 0 24 24"
          width="22"
          height="22"
          fill="none"
        >
          <path
            d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"
            stroke="currentColor"
            stroke-width="1.8"
          />

          <path
            d="M19 13.5v-3l-2-.7a7.4 7.4 0 0 0-.7-1.7l.9-1.9-2.1-2.1-1.9.9a7.4 7.4 0 0 0-1.7-.7L10.8 2h-3l-.7 2.3a7.4 7.4 0 0 0-1.7.7l-1.9-.9-2.1 2.1.9 1.9a7.4 7.4 0 0 0-.7 1.7l-2 .7v3l2 .7c.2.6.4 1.2.7 1.7l-.9 1.9 2.1 2.1 1.9-.9c.5.3 1.1.5 1.7.7l.7 2.3h3l.7-2.3c.6-.2 1.2-.4 1.7-.7l1.9.9 2.1-2.1-.9-1.9c.3-.5.5-1.1.7-1.7l2-.7Z"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linejoin="round"
          />
        </svg>
      </button>

    </header>


    <!-- ================= CHAT AREA ================= -->

    <main
      class="chat-area"
      id="chatArea"
    >

      <section
        class="welcome-screen"
        id="welcomeScreen"
      >

        <h2>What's on your mind?</h2>


        <div class="suggestions-list">

          <button
            type="button"
            class="suggestion-item"
          >
            <span class="icon">🩺</span>
            <span class="text">
              Prepare for a doctor visit
            </span>
          </button>


          <button
            type="button"
            class="suggestion-item"
          >
            <span class="icon">🛋️</span>
            <span class="text">
              Visualize new home decor
            </span>
          </button>


          <button
            type="button"
            class="suggestion-item"
          >
            <span class="icon">🐱</span>
            <span class="text">
              Create city cat art
            </span>
          </button>

        </div>

      </section>

    </main>


    <!-- ================= COMPOSER ================= -->

    <div class="composer-wrapper">

      <div class="composer">

        <!-- PLUS -->

        <button
          class="icon-btn"
          id="plusBtn"
          type="button"
          aria-label="Add"
        >
          <svg
            viewBox="0 0 24 24"
            width="22"
            height="22"
            fill="none"
          >
            <path
              d="M12 5v14M5 12h14"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>


        <!-- INPUT -->

        <textarea
          id="messageInput"
          rows="1"
          placeholder="Ask PingMe AI"
          autocomplete="off"
        ></textarea>


        <!-- MIC -->

        <button
          class="icon-btn"
          id="micBtn"
          type="button"
          aria-label="Voice input"
        >
          <svg
            viewBox="0 0 24 24"
            width="21"
            height="21"
            fill="none"
          >
            <rect
              x="8"
              y="3"
              width="8"
              height="12"
              rx="4"
              stroke="currentColor"
              stroke-width="1.8"
            />

            <path
              d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
        </button>


        <!-- SEND -->

        <button
          class="send-btn"
          id="sendBtn"
          type="button"
          aria-label="Send message"
        >

          <svg
            id="voiceIcon"
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            style="display:none;"
          >
            <path
              d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
            />
          </svg>


          <svg
            id="sendIcon"
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
          >
            <path
              d="M12 19V5M6 11l6-6 6 6"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>

        </button>

      </div>


      <!-- PLUS MENU -->

      <div
        class="attachment-menu"
        id="attachmentMenu"
        hidden
      >

        <button
          type="button"
          id="cameraBtn"
        >
          Camera
        </button>

        <button
          type="button"
          id="photoOption"
        >
          Photo
        </button>

        <button
          type="button"
          id="fileOption"
        >
          File
        </button>

        <button
          type="button"
          id="audioOption"
        >
          Audio
        </button>

        <button
          type="button"
          id="screenOption"
        >
          Screen
        </button>

        <button
          type="button"
          id="projectOption"
        >
          Project
        </button>

      </div>


      <!-- NOTE -->

      <div class="composer-note">
        PingMe AI can make mistakes. Check important information.
      </div>

    </div>

  </div>


  <!-- ================= FIREBASE AI ================= -->

  <script type="module">

    import {
      initializeApp
    } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


    import {
      getAI,
      getGenerativeModel,
      GoogleAIBackend
    } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-ai.js";


    const firebaseConfig = {

      apiKey:"AIzaSyB4dAUhxEao415YdVg4l4WYJ21hQ9V-tyk",
        

      authDomain:
        "pingme-ai-8d8cc.firebaseapp.com",

      projectId:
        "pingme-ai-8d8cc",

      storageBucket:
        "pingme-ai-8d8cc.firebasestorage.app",

      messagingSenderId:
        "547217020747",

      appId:
        "1:547217020747:web:62b7d3843672703d8abace",

      measurementId:
        "G-3WRC64CRDR"

    };


    const firebaseApp =
      initializeApp(firebaseConfig);


    const ai =
      getAI(firebaseApp, {
        backend:
          new GoogleAIBackend()
      });


    const model1 =
      getGenerativeModel(ai, {
        model:
          "gemini-3.7-flash"
      });


    const model2 =
      getGenerativeModel(ai, {
        model:
          "gemini-3.5-flash-lite"
      });


    const model3 =
      getGenerativeModel(ai, {
        model:
          "gemini-3.6-flash"
      });


    window.pingMeAIModel1 = model1;
    window.pingMeAIModel2 = model2;
    window.pingMeAIModel3 = model3;

    window.pingMeAIModel = model1;

  </script>


  <!-- ================= JAVASCRIPT ================= -->

  <script src="chat-ui.js"></script>
  <script src="script.js"></script>
  <script src="voice.js"></script>

</body>
</html>
