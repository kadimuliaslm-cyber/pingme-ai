
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <title>PingMe AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- =========================
         HEADER
    ========================== -->
    <header class="top-bar">

      <div class="brand">

        <div class="brand-icon">
          ✦
        </div>

        <div>
          <h1>PingMe AI</h1>
          <span>AI Assistant</span>
        </div>

      </div>

      <button
        class="menu-btn"
        id="menuBtn"
        aria-label="Menu">
        ⋮
      </button>

    </header>


    <!-- =========================
         CHAT AREA
    ========================== -->
    <main
      class="chat-area"
      id="chatArea">

      <section
        class="welcome-screen"
        id="welcomeScreen">

        <div class="welcome-icon">
          ✦
        </div>

        <h2>How can I help you?</h2>

        <p>
          Ask me anything. You can chat in বাংলা or English.
        </p>

        <div class="suggestions">

          <button class="suggestion">
            ✨ Write something for me
          </button>

          <button class="suggestion">
            💡 Give me an idea
          </button>

          <button class="suggestion">
            🌐 Translate something
          </button>

        </div>

      </section>

    </main>


    <!-- =========================
         MESSAGE COMPOSER
    ========================== -->
    <div class="composer-wrapper">

      <div class="composer">


        <!-- PLUS / ATTACHMENT BUTTON -->
        <button
          class="icon-btn plus-btn"
          id="plusBtn"
          aria-label="Add attachment"
          aria-expanded="false"
          type="button">

          +

        </button>


        <!-- =========================
             ATTACHMENT MENU
        ========================== -->
        <div
          class="attachment-menu"
          id="attachmentMenu"
          aria-hidden="true">


          <!-- PHOTO -->
          <button
            class="attachment-option"
            id="photoOption"
            type="button"
            aria-label="Send photo">

            <span class="attachment-icon photo-icon">

              <svg
                viewBox="0 0 24 24"
                width="22"
                height="22"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">

                <rect
                  x="3"
                  y="3"
                  width="18"
                  height="18"
                  rx="3">
                </rect>

                <circle
                  cx="8.5"
                  cy="8.5"
                  r="1.5">
                </circle>

                <path
                  d="M21 15l-5-5L5 21">
                </path>

              </svg>

            </span>

            <span class="attachment-label">
              Photo
            </span>

          </button>


          <!-- VIDEO -->
          <button
            class="attachment-option"
            id="videoOption"
            type="button"
            aria-label="Send video">

            <span class="attachment-icon video-icon">

              <svg
                viewBox="0 0 24 24"
                width="22"
                height="22"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">

                <rect
                  x="3"
                  y="5"
                  width="13"
                  height="14"
                  rx="2">
                </rect>

                <path
                  d="M16 10l5-3v10l-5-3z">
                </path>

              </svg>

            </span>

            <span class="attachment-label">
              Video
            </span>

          </button>


          <!-- FILE -->
          <button
            class="attachment-option"
            id="fileOption"
            type="button"
            aria-label="Send file">

            <span class="attachment-icon file-icon">

              <svg
                viewBox="0 0 24 24"
                width="22"
                height="22"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">

                <path
                  d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z">
                </path>

                <polyline
                  points="14 2 14 8 20 8">
                </polyline>

                <line
                  x1="8"
                  y1="13"
                  x2="16"
                  y2="13">
                </line>

                <line
                  x1="8"
                  y1="17"
                  x2="14"
                  y2="17">
                </line>

              </svg>

            </span>

            <span class="attachment-label">
              File
            </span>

          </button>


          <!-- AUDIO -->
          <button
            class="attachment-option"
            id="audioOption"
            type="button"
            aria-label="Send audio">

            <span class="attachment-icon audio-icon">

              <svg
                viewBox="0 0 24 24"
                width="22"
                height="22"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">

                <path
                  d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z">
                </path>

                <path
                  d="M19 11a7 7 0 0 1-14 0">
                </path>

                <line
                  x1="12"
                  y1="18"
                  x2="12"
                  y2="22">
                </line>

                <line
                  x1="8"
                  y1="22"
                  x2="16"
                  y2="22">
                </line>

              </svg>

            </span>

            <span class="attachment-label">
              Audio
            </span>

          </button>


        </div>


        <!-- CAMERA -->
        <button
          class="icon-btn camera-btn"
          id="cameraBtn"
          aria-label="Camera"
          type="button">

          <svg
            viewBox="0 0 24 24"
            width="21"
            height="21"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">

            <path
              d="M4 7h3l2-2h6l2 2h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z">
            </path>

            <circle
              cx="12"
              cy="13"
              r="3.5">
            </circle>

          </svg>

        </button>


        <!-- MESSAGE INPUT -->
        <textarea
          id="messageInput"
          rows="1"
          placeholder="Message PingMe AI..."
          autocomplete="off">
        </textarea>


        <!-- VOICE BUTTON -->
        <button
          class="icon-btn mic-btn"
          id="micBtn"
          aria-label="Voice input"
          type="button">

          <svg
            viewBox="0 0 24 24"
            width="22"
            height="22"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">

            <rect
              x="9"
              y="3"
              width="6"
              height="11"
              rx="3">
            </rect>

            <path
              d="M5.5 11a6.5 6.5 0 0 0 13 0">
            </path>

            <path
              d="M12 17.5V21">
            </path>

            <path
              d="M8.5 21h7">
            </path>

          </svg>

        </button>


        <!-- SEND BUTTON -->
        <button
          class="send-btn"
          id="sendBtn"
          aria-label="Send message"
          type="button">

          <svg
            viewBox="0 0 24 24"
            width="21"
            height="21"
            fill="none"
            stroke="currentColor"
            stroke-width="2.3"
            stroke-linecap="round"
            stroke-linejoin="round">

            <path
              d="M5 12h13">
            </path>

            <path
              d="M13 6l6 6-6 6">
            </path>

          </svg>

        </button>


      </div>


      <!-- COMPOSER NOTE -->
      <div class="composer-note">
        PingMe AI can make mistakes. Check important information.
      </div>

    </div>

  </div>


  <!-- =========================
       FIREBASE AI LOGIC
  ========================== -->
  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAI,
      getGenerativeModel,
      GoogleAIBackend
    }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-ai.js";


    const firebaseConfig = {

      apiKey: "AIzaSyB4dAUhxEao415YdVg4l4WYJ21hQ9V-tyk",

      authDomain:
        "pingme-ai-8d8cc.firebaseapp.com",

      projectId:
        "pingme-ai-8d8cc",

      storageBucket:
        "pingme-ai-8d8cc.firebasestorage.app",

      messagingSenderId:
        "547217020747",

      appId:
        "1:547217020747:web:62b7d3843672703d8abace",

      measurementId:
        "G-3WRC64CRDR"

    };


    const firebaseApp =
      initializeApp(firebaseConfig);


    const ai =
      getAI(firebaseApp, {
        backend: new GoogleAIBackend()
      });


    const model =
      getGenerativeModel(ai, {
        model: "gemini-3.8-flash"
      });


    window.pingMeAIModel = model;

  </script>


  <!-- =========================
       PINGME AI JAVASCRIPT
  ========================== -->
  <script
    src="script.js"
    defer>
  </script>

</body>
</html>
