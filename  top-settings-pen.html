<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PingMe AI - Top Settings</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f1f1f1;
    font-family:Arial,sans-serif;
    color:#111;
}

/* TOP BAR */

.top-bar{
    display:flex;
    justify-content:space-between;
    padding:14px;
}

.pill{
    height:50px;
    background:#fff;
    border:0;
    border-radius:999px;
    box-shadow:0 1px 6px rgba(0,0,0,.12);
    cursor:pointer;
}

.left{
    width:66px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:6px;
    padding-left:18px;
}

.l{
    width:18px;
    height:2px;
    background:#000;
    border-radius:10px;
}

.l.s{
    width:12px;
}

.right{
    width:98px;
    display:flex;
    align-items:center;
    justify-content:space-around;
}


/* MESSAGE ICON */

.message-icon{
    width:20px;
    height:16px;
    border:1.8px solid #111;
    border-radius:4px;
    position:relative;
    display:block;
}

.message-icon:after{
    content:"";
    position:absolute;
    bottom:-5px;
    left:4px;
    width:6px;
    height:6px;
    border-left:1.8px solid #111;
    border-bottom:1.8px solid #111;
    transform:skewY(-35deg);
    background:#fff;
}


/* PEN ICON */

.pen-box{
    width:20px;
    height:20px;
    position:relative;
    display:block;
}

.pen-box:before{
    content:"";
    position:absolute;
    width:13px;
    height:6px;
    border:1.8px solid #111;
    border-radius:2px;
    transform:rotate(-45deg);
    left:3px;
    top:7px;
}

.pen-box:after{
    content:"";
    position:absolute;
    width:5px;
    height:5px;
    border-left:1.8px solid #111;
    border-bottom:1.8px solid #111;
    transform:rotate(-45deg);
    left:1px;
    top:12px;
}


/* COMMON PANEL */

.panel{
    position:fixed;
    top:74px;
    right:14px;
    width:310px;
    max-width:calc(100% - 28px);
    max-height:calc(100vh - 90px);
    overflow-y:auto;

    background:#fff;
    border-radius:18px;

    box-shadow:0 8px 35px rgba(0,0,0,.16);

    padding:10px;

    opacity:0;
    visibility:hidden;

    transform:translateY(-8px);

    transition:
        opacity .2s ease,
        transform .2s ease,
        visibility .2s ease;

    z-index:100;
}

.panel.show{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
}


/* PANEL ITEM */

.panel-item{
    width:100%;
    border:0;
    background:transparent;

    display:flex;
    align-items:center;

    gap:12px;

    padding:11px 10px;

    border-radius:12px;

    cursor:pointer;
    text-align:left;
}

.panel-item:hover{
    background:#f5f5f5;
}

.panel-icon{
    width:25px;
    min-width:25px;
    height:25px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.panel-icon svg{
    width:19px;
    height:19px;

    fill:none;
    stroke:#111;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.panel-text{
    display:flex;
    flex-direction:column;
}

.panel-title{
    font-size:13px;
    font-weight:600;
}

.panel-description{
    margin-top:2px;
    color:#777;
    font-size:10px;
}


/* DIVIDER */

.panel-divider{
    height:1px;
    background:#e8e8e8;
    margin:7px 8px;
}


/* LEFT MENU */

.side-menu{
    position:fixed;
    top:0;
    left:0;

    width:280px;
    max-width:85%;
    height:100vh;

    background:#fff;

    box-shadow:5px 0 25px rgba(0,0,0,.12);

    transform:translateX(-105%);
    transition:.3s ease;

    z-index:200;

    padding:18px 14px;
}

.side-menu.show{
    transform:translateX(0);
}

.menu-title{
    font-size:18px;
    font-weight:700;
    margin-bottom:18px;
}

.menu-item{
    width:100%;
    border:0;
    background:transparent;

    display:flex;
    align-items:center;

    gap:13px;

    padding:13px 10px;

    border-radius:12px;

    cursor:pointer;
    text-align:left;
}

.menu-item:hover{
    background:#f5f5f5;
}

.menu-icon{
    width:25px;
    min-width:25px;
    height:25px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.menu-icon svg{
    width:19px;
    height:19px;

    fill:none;
    stroke:#111;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.menu-text{
    font-size:14px;
}

.close-menu{
    position:absolute;

    top:15px;
    right:12px;

    border:0;

    background:#f5f5f5;

    width:34px;
    height:34px;

    border-radius:50%;

    font-size:20px;

    cursor:pointer;
}


/* OVERLAY */

.overlay{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.15);

    opacity:0;
    visibility:hidden;

    transition:.2s;

    z-index:150;
}

.overlay.show{
    opacity:1;
    visibility:visible;
}


/* SAMPLE MESSAGE */

.message{
    margin:100px 20px;

    background:#fff;

    padding:16px;

    border-radius:16px;

    max-width:500px;
}


/* MOBILE */

@media(max-width:600px){

    .panel{
        top:70px;
        right:10px;
        width:calc(100% - 20px);
    }

    .side-menu{
        width:280px;
    }

}
</style>
</head>


<body>

    <!-- COPY MESSAGE -->

        class="panel-item"
        id="copyMessageBtn">

                <rect
                    x="8"

<!-- ================================= -->
<!-- SAMPLE MESSAGE -->
<!-- ================================= -->

<div
    class="message"
    id="sampleMessage">

    This is a sample PingMe AI message.

</div>


<script>

/* ELEMENTS */

const menuBtn =
    document.getElementById("menuBtn");

const sideMenu =
    document.getElementById("sideMenu");

const closeMenu =
    document.getElementById("closeMenu");

const overlay =
    document.getElementById("overlay");

const topBtn =
    document.getElementById("topBtn");

const settingsPanel =
    document.getElementById("settingsPanel");

const penPanel =
    document.getElementById("penPanel");

const messageIcon =
    document.getElementById("messageIcon");

const penIcon =
    document.getElementById("penIcon");

const copyMessageBtn =
    document.getElementById("copyMessageBtn");

const editMessageBtn =
    document.getElementById("editMessageBtn");

const sampleMessage =
    document.getElementById("sampleMessage");


/* ================================= */
/* LEFT MENU */
/* ================================= */

menuBtn.addEventListener(
    "click",
    function(e){

        e.stopPropagation();

        sideMenu.classList.add("show");

        overlay.classList.add("show");

        settingsPanel.classList.remove("show");

        penPanel.classList.remove("show");

    }
);


/* CLOSE MENU */

closeMenu.addEventListener(
    "click",
    function(){

        sideMenu.classList.remove("show");

        overlay.classList.remove("show");

    }
);


/* OVERLAY */

overlay.addEventListener(
    "click",
    function(){

        sideMenu.classList.remove("show");

        overlay.classList.remove("show");

    }
);


/* ================================= */
/* TOP RIGHT BUTTON */
/* ================================= */

topBtn.addEventListener(
    "click",
    function(e){

        e.stopPropagation();

        /*
        MESSAGE ICON
        = SETTINGS
        */

        if(
            messageIcon.style.display !== "none"
        ){

            settingsPanel.classList.toggle("show");

            penPanel.classList.remove("show");

        }

        /*
        PEN ICON
        = COPY + EDIT
        */

        else{

            penPanel.classList.toggle("show");

            settingsPanel.classList.remove("show");

        }

    }
);


/* ================================= */
/* OUTSIDE CLICK */
/* ================================= */

document.addEventListener(
    "click",
    function(e){

        if(
            !topBtn.contains(e.target) &&
            !settingsPanel.contains(e.target) &&
            !penPanel.contains(e.target)
        ){

            settingsPanel.classList.remove("show");

            penPanel.classList.remove("show");

        }

    }
);


/* ================================= */
/* COPY MESSAGE */
/* ================================= */

copyMessageBtn.addEventListener(
    "click",
    function(e){

        e.stopPropagation();

        const text =
            sampleMessage.innerText;

        navigator.clipboard.writeText(text)
        .then(
            function(){

                const title =
                    copyMessageBtn.querySelector(
                        ".panel-title"
                    );

                title.textContent =
                    "Copied!";

                setTimeout(
                    function(){

                        title.textContent =
                            "Copy Message";

                    },
                    1200
                );

            }
        );

    }
);


/* ================================= */
/* EDIT MESSAGE */
/* ================================= */

editMessageBtn.addEventListener(
    "click",
    function(e){

        e.stopPropagation();

        const oldText =
            sampleMessage.innerText;

        const newText =
            prompt(
                "Edit message:",
                oldText
            );

        if(
            newText !== null &&
            newText.trim() !== ""
        ){

            sampleMessage.innerText =
                newText;

        }

        penPanel.classList.remove("show");

    }
);


/* ================================= */
/* DEMO */
/*
   এই sample-এ message icon থেকে
   pen icon দেখানোর জন্য নিচের অংশটি
   test হিসেবে রাখা হয়েছে।

   তিন-ডট অংশে right-click করলে
   pen icon দেখা যাবে।
*/
/* ================================= */

topBtn.addEventListener(
    "contextmenu",
    function(e){

        e.preventDefault();

        messageIcon.style.display =
            "none";

        penIcon.style.display =
            "block";

        settingsPanel.classList.remove("show");

        penPanel.classList.remove("show");

    }
);

</script>

</body>
</html>
